name: Apply scalar brace initializers

on:
  push:
    branches:
      - agent/scalar-brace-initializers

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scalar-brace-initializers
          fetch-depth: 0
      - name: Apply scalar-brace migration
        run: python3 tools/apply_scalar_brace_initializers.py
      - name: Audit scalar initializer paths
        run: |
          grep -n -B 8 -A 42 'append_automatic_scalar_initializer' parse.c | head -n 320
          grep -n -B 8 -A 32 'parse_static_image_initializer' parse.c | head -n 220
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c Makefile README.md test/scalar_brace_initializers.sh
          git commit -m "Support C11 scalar brace initializers"
          git push origin HEAD:agent/scalar-brace-initializers
