name: Apply preprocessor conditional patch

on:
  push:
    branches:
      - automation/pp-conditional-operator

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/pp-conditional-operator
      - name: Apply patch
        run: python3 tools/apply_pp_conditional_patch.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c test/preprocessor_advanced.sh
          git commit -m "Support conditional operator in preprocessor expressions"
          git push
