name: Apply null pointer constant migration

on:
  push:
    branches:
      - agent/null-pointer-constant-expressions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/null-pointer-constant-expressions
      - name: Apply migration
        run: python3 apply_null_pointer_constexpr.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f apply_null_pointer_constexpr.py
          rm -f .github/workflows/apply-null-pointer-constexpr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support integer constant-expression null pointers"
          git push origin HEAD:agent/null-pointer-constant-expressions
