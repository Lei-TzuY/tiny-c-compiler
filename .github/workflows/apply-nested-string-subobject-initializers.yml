name: Apply nested string subobject initializer migration

on:
  push:
    branches:
      - agent/nested-string-subobject-initializers

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nested-string-subobject-initializers
      - name: Apply migration
        run: python3 tools/apply_nested_string_subobject_initializers.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm tools/apply_nested_string_subobject_initializers.py
          rm .github/workflows/apply-nested-string-subobject-initializers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Support nested string subobject initializers'
          git push origin HEAD:agent/nested-string-subobject-initializers
