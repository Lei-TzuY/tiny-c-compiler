name: Apply function return normalization

on:
  push:
    branches:
      - fix/function-call-return-normalization
    paths:
      - tools/apply_function_return_normalization.py
      - test/function_return_abi.sh
      - .github/workflows/apply-function-return-normalization.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/function-call-return-normalization
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_function_return_normalization.py
      - name: Audit return normalization
        run: |
          grep -q 'normalize(node->ty)' codegen.c
          grep -q 'test/function_return_abi.sh' Makefile
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated changes
        run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add codegen.c Makefile test/function_return_abi.sh
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Normalize scalar function call returns'
          git push origin HEAD:fix/function-call-return-normalization
