name: Apply preprocessor short-circuit patch

on:
  push:
    branches:
      - fix-pp-if-short-circuit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pp-if-short-circuit
      - name: Apply focused fix and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('preprocess_v2.c')
          s = path.read_text()
          old = '''typedef struct {
              const char *p;
              int depth;
          } PPExpr;'''
          new = '''typedef struct {
              const char *p;
              int depth;
              bool suppress_eval;
          } PPExpr;'''
          if old not in s:
              raise SystemExit('PPExpr pattern not found')
          s = s.replace(old, new, 1)

          old = '''        else if (pp_consume(e, "/")) {
                      int64_t rhs = pp_unary(e);
                      if (!rhs) error("division by zero in #if expression");
                      val /= rhs;
                  } else if (pp_consume(e, "%")) {
                      int64_t rhs = pp_unary(e);
                      if (!rhs) error("division by zero in #if expression");
                      val %= rhs;
                  } else return val;'''
          new = '''        else if (pp_consume(e, "/")) {
                      int64_t rhs = pp_unary(e);
                      if (!e->suppress_eval) {
                          if (!rhs) error("division by zero in #if expression");
                          val /= rhs;
                      }
                  } else if (pp_consume(e, "%")) {
                      int64_t rhs = pp_unary(e);
                      if (!e->suppress_eval) {
                          if (!rhs) error("division by zero in #if expression");
                          val %= rhs;
                      }
                  } else return val;'''
          if old not in s:
              raise SystemExit('pp_mul pattern not found')
          s = s.replace(old, new, 1)

          old = '''static int64_t pp_logand(PPExpr *e) {
              int64_t val = pp_bitor(e);
              while (pp_consume(e, "&&")) {
                  int64_t rhs = pp_bitor(e);
                  val = val && rhs;
              }
              return val;
          }

          static int64_t pp_logor(PPExpr *e) {
              int64_t val = pp_logand(e);
              while (pp_consume(e, "||")) {
                  int64_t rhs = pp_logand(e);
                  val = val || rhs;
              }
              return val;
          }'''
          new = '''static int64_t pp_logand(PPExpr *e) {
              int64_t val = pp_bitor(e);
              while (pp_consume(e, "&&")) {
                  bool saved = e->suppress_eval;
                  if (!saved && !val)
                      e->suppress_eval = true;
                  int64_t rhs = pp_bitor(e);
                  e->suppress_eval = saved;
                  if (!saved)
                      val = val && rhs;
              }
              return val;
          }

          static int64_t pp_logor(PPExpr *e) {
              int64_t val = pp_logand(e);
              while (pp_consume(e, "||")) {
                  bool saved = e->suppress_eval;
                  if (!saved && val)
                      e->suppress_eval = true;
                  int64_t rhs = pp_logand(e);
                  e->suppress_eval = saved;
                  if (!saved)
                      val = val || rhs;
              }
              return val;
          }'''
          if old not in s:
              raise SystemExit('logical operator pattern not found')
          s = s.replace(old, new, 1)
          path.write_text(s)

          t = Path('test/preprocessor_advanced.sh')
          s = t.read_text()
          marker = 'echo "All advanced preprocessor tests passed!"\n'
          addition = r'''# #if logical operators must short-circuit unevaluated operands.
          assert_pp_adv 21 '#if 0 && (1 / 0)
          int main() { return 0; }
          #else
          int main() { return 21; }
          #endif'

          assert_pp_adv 22 '#if 1 || (1 / 0)
          int main() { return 22; }
          #else
          int main() { return 0; }
          #endif'

          # Nested skipped operands are still parsed while remaining unevaluated.
          assert_pp_adv 23 '#define ZERO 0
          #if ZERO && (1 || (7 % 0))
          int main() { return 0; }
          #elif 1 || (0 && (9 / 0))
          int main() { return 23; }
          #else
          int main() { return 0; }
          #endif'

          # A zero divisor in an actually evaluated operand remains an error.
          assert_pp_fail '#if 1 && (1 / 0)
          int main() { return 0; }
          #endif'

          '''
          if marker not in s:
              raise SystemExit('test marker not found')
          s = s.replace(marker, addition + marker, 1)
          t.write_text(s)
          PY
          rm .github/workflows/zz-patch-short-circuit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c test/preprocessor_advanced.sh .github/workflows/zz-patch-short-circuit.yml
          git commit -m "Honor short-circuit semantics in preprocessor conditions"
          git push origin HEAD:fix-pp-if-short-circuit
