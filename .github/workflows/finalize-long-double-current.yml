name: Finalize long double integration

on:
  push:
    paths:
      - .github/workflows/finalize-long-double-current.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/long-double-x87-current
      - name: Apply finalizer
        run: python3 tools/finalize_long_double_current.py
      - name: Commit compatibility updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/floating_literals.sh test/float_header.sh test/long_double.sh preprocess_v2.c README.md
          git commit -m 'Finalize long double headers and regressions'
          git push origin HEAD:feat/long-double-x87-current
      - name: Focused verification
        run: |
          make clean && make
          bash test/floating_literals.sh
          bash test/float_header.sh
          bash test/long_double.sh
          bash test/long_double_abi.sh
          bash test/math_header.sh
