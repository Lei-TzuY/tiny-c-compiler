name: Apply static array designator migration

on:
  push:
    branches:
      - agent/static-array-designators

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_static_array_designators.py
      - name: Run full test suite
        run: |
          make clean
          make test
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parse.c Makefile README.md test/array_designators.sh
          git commit -m 'Implement integer constant-expression array designators'
          git push
