name: Apply C escape sequence migration

on:
  push:
    branches:
      - agent/c-escape-sequences

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c-escape-sequences
      - name: Apply migration
        run: |
          python3 tools/apply_escape_sequences.py
          python3 tools/fix_escape_test_quoting.py
      - name: Run full test suite
        run: make test
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tokenize.c Makefile README.md test/escape_sequences.sh
          git commit -m "Implement C numeric escape sequences"
          git push origin HEAD:agent/c-escape-sequences
