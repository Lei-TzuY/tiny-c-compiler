name: Apply static integer initializer migration

on:
  push:
    branches: [agent/static-integer-initializers]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/static-integer-initializers
      - name: Apply migration
        run: python3 tools/apply_static_integer_initializers.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm tools/apply_static_integer_initializers.py
          rm .github/workflows/apply-static-integer-initializers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Support static integer constant-expression initializers'
          git push origin HEAD:agent/static-integer-initializers
