name: Apply prototype arity migration

on:
  push:
    branches:
      - agent/prototype-arity-checks

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prototype-arity-checks
      - name: Apply migration
        run: python3 tools/apply_prototype_arity.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f tools/apply_prototype_arity.py .github/workflows/apply-prototype-arity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce prototype call arity"
          git push origin HEAD:agent/prototype-arity-checks
