name: Apply control substatement grammar

on:
  push:
    branches:
      - agent/control-substatement-grammar

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/control-substatement-grammar
          fetch-depth: 0
      - name: Apply control-substatement migration
        run: python3 tools/apply_control_substatement_grammar.py
      - name: Audit statement-only body gates
        run: |
          grep -n -B 6 -A 16 'require_control_substatement' parse.c | head -n 180
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c README.md test/control_flow_context.sh
          git commit -m "Require statements for control-flow bodies"
          git push origin HEAD:agent/control-substatement-grammar
