name: Apply SysV stack argument migration

on:
  push:
    branches:
      - agent/sysv-stack-args

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sysv-stack-args
      - name: Apply migration
        run: python3 tools/apply_sysv_stack_args.py
      - name: Normalize prototype regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("test/abi_stack_args.sh")
          s = p.read_text()
          old = "int sum7(int,int,int,int,int,int,int);"
          new = "int sum7(int a,int b,int c,int d,int e,int f,int g);"
          if old not in s:
              raise SystemExit("unnamed prototype regression not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f tools/apply_sysv_stack_args.py .github/workflows/apply-sysv-stack-args.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support SysV stack-passed scalar arguments"
          git push origin HEAD:agent/sysv-stack-args
