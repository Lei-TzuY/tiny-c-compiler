name: Apply restrict qualifier migration

on:
  push:
    branches:
      - agent/restrict-qualifier

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restrict-qualifier
          fetch-depth: 0
      - name: Apply restrict qualifier migration
        run: python3 tools/apply_restrict_qualifier.py
      - name: Fix restrict qualifier edge cases
        run: python3 tools/fix_restrict_qualifier_edges.py
      - name: Audit qualifier sites
        run: |
          grep -nE 'is_const|is_volatile|is_restrict|qualify_type' minicc.h type.c parse.c | head -n 260
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minicc.h type.c parse.c tokenize.c README.md Makefile test/restrict_qualifier.sh
          git commit -m "Complete restrict qualifier semantics"
          git push origin HEAD:agent/restrict-qualifier
