name: Apply scoped enum migration

on:
  push:
    branches:
      - agent/scoped-enum-constants

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scoped-enum-constants
      - name: Apply migration
        run: python3 tools/apply_scoped_enums.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f tools/apply_scoped_enums.py .github/workflows/apply-scoped-enums.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Scope enumeration constants lexically"
          git push origin HEAD:agent/scoped-enum-constants
