name: Apply string array initializer migration

on:
  push:
    branches:
      - agent/string-array-initializers

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/string-array-initializers
      - name: Apply migration
        run: python3 tools/apply_string_array_initializers.py
      - name: Run full test suite
        run: make test
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minicc.h parse.c codegen.c Makefile README.md test/string_array_initializers.sh
          git commit -m 'Implement character array string initializers'
          git push
