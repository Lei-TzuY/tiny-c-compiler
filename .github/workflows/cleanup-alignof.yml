name: Cleanup _Alignof migration
on:
  push:
    branches:
      - agent/c11-alignof
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c11-alignof
      - name: Collapse duplicate parser block
        run: python3 tools/cleanup_alignof.py
      - name: Remove one-shot helpers
        run: rm -f tools/cleanup_alignof.py .github/workflows/cleanup-alignof.yml
      - name: Build compiler
        run: make clean && make
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Clean _Alignof parser migration"
          git push origin HEAD:agent/c11-alignof
