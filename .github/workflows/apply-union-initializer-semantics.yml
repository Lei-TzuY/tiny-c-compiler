name: Apply union initializer migration

on:
  push:
    branches:
      - agent/union-initializer-semantics
    paths:
      - tools/apply_union_initializer_semantics.py
      - .github/workflows/apply-union-initializer-semantics.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_union_initializer_semantics.py
      - name: Run full test suite
        run: |
          make clean
          make test
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minicc.h parse.c Makefile README.md test/union_initializers.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Enforce union initializer semantics"
          git push origin HEAD:agent/union-initializer-semantics
