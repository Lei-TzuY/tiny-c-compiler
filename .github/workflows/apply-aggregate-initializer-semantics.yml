name: Apply aggregate initializer semantics migration

on:
  push:
    branches:
      - agent/aggregate-initializer-semantics

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python3 tools/apply_aggregate_initializer_semantics.py
      - name: Run full test suite
        run: make test
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parse.c Makefile README.md test/aggregate_initializers.sh
          git commit -m 'Enforce aggregate initializer semantics'
          git push
