name: Apply predefined macros
on:
  push:
    branches:
      - agent/c11-predefined-macros
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c11-predefined-macros
      - name: Apply migration
        run: python3 tools/apply_predefined_macros.py
      - name: Test
        run: make clean && make test
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preprocess_v2.c
          git diff --cached --quiet && exit 0
          git commit -m "Support standard predefined C macros"
          git push origin HEAD:agent/c11-predefined-macros
