name: Apply duplicate label constraints

on:
  push:
    branches:
      - agent/duplicate-label-constraints

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/duplicate-label-constraints
          fetch-depth: 0
      - name: Apply duplicate-label migration
        run: python3 tools/apply_duplicate_label_constraints.py
      - name: Audit duplicate-label parser path
        run: |
          grep -n -B 8 -A 26 "duplicate label" parse.c | head -n 80
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c README.md test/control_flow_context.sh
          git commit -m "Reject duplicate labels within a function"
          git push origin HEAD:agent/duplicate-label-constraints
