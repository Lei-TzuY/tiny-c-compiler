name: Apply preprocessor signedness fix

on:
  push:
    branches:
      - fix-pp-unsigned-intmax-semantics

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pp-unsigned-intmax-semantics
      - name: Apply patch
        run: python3 .github/apply_pp_unsigned_fix.py
      - name: Run complete regression suite
        run: make clean && make test
      - name: Commit verified changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c Makefile test/preprocessor_integer_semantics.sh
          git commit -m 'Fix #if signed and unsigned integer semantics [unsigned-if-applied]'
          git push origin HEAD:fix-pp-unsigned-intmax-semantics
