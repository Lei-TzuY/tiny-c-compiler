name: Apply expression operator semantics migration

on:
  push:
    branches:
      - agent/expression-operator-semantics
    paths:
      - migration_expression_operators.py
      - .github/workflows/apply-expression-operators.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expression-operator-semantics
      - name: Apply migration
        run: python3 migration_expression_operators.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm migration_expression_operators.py
          rm .github/workflows/apply-expression-operators.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce expression operator semantics'
          git push origin agent/expression-operator-semantics
