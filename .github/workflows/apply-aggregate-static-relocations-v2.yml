name: Apply aggregate static relocation migration v2

on:
  push:
    branches:
      - agent/aggregate-static-relocations-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aggregate-static-relocations-v2
      - name: Apply migration
        run: python3 tools/apply_aggregate_static_relocations_v2.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm tools/apply_aggregate_static_relocations_v2.py
          rm .github/workflows/apply-aggregate-static-relocations-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Support aggregate static relocation initializers'
          git push origin HEAD:agent/aggregate-static-relocations-v2
