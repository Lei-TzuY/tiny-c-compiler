name: Apply ordinary namespace v2

on:
  push:
    branches:
      - agent/ordinary-identifier-namespace-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ordinary-identifier-namespace-v2
          fetch-depth: 0

      - name: Apply verified formal diff
        run: |
          git fetch origin agent/ordinary-identifier-namespace
          git diff 965f25c31bea034296516d101aafe56f3e7706bf f4ed52990090e31447df157eeb7dfd372eb59d94 -- parse.c Makefile README.md test/ordinary_namespace.sh > /tmp/ordinary.patch
          git apply --3way /tmp/ordinary.patch

      - name: Test compiler
        run: make clean && make test

      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/apply-ordinary-namespace-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c Makefile README.md test/ordinary_namespace.sh .github/workflows/apply-ordinary-namespace-v2.yml
          git commit -m "Enforce the ordinary identifier namespace"
          git push origin HEAD:agent/ordinary-identifier-namespace-v2
