name: Apply control-flow context migration
on:
  push:
    branches:
      - agent/control-flow-context
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/control-flow-context
      - name: Apply migration
        run: python3 scripts/apply_control_flow_context.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm scripts/apply_control_flow_context.py
          rm .github/workflows/apply-control-flow-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce break and continue context constraints'
          git push origin agent/control-flow-context
