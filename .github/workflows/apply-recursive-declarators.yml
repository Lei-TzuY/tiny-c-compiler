name: Apply recursive declarator migration

on:
  push:
    branches: [agent/recursive-declarators]
    paths:
      - 'tools/apply_recursive_declarators.py'
      - '.github/workflows/apply-recursive-declarators.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recursive-declarators
      - name: Apply migration
        run: python3 tools/apply_recursive_declarators.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f tools/apply_recursive_declarators.py .github/workflows/apply-recursive-declarators.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement recursive C declarators"
          git push origin HEAD:agent/recursive-declarators
