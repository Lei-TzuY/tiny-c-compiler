name: Migrate stdlib C11 refresh

on:
  push:
    branches:
      - feat/stdlib-c11-refresh

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stdlib-c11-refresh
          fetch-depth: 0
      - name: Apply stdlib refresh
        run: python3 tools/migrate_stdlib_c11.py
      - name: Commit migrated sources
        run: |
          if git diff --quiet -- preprocess_v2.c test/stdlib_header.sh; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c test/stdlib_header.sh
          git commit -m 'Expand supported stdlib.h declarations'
          git push origin HEAD:feat/stdlib-c11-refresh
