name: Apply compound literals
on:
  push:
    branches:
      - agent/compound-literals
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_compound_literals.py
      - name: Test
        run: |
          make clean
          make test
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minicc.h parse.c codegen.c Makefile README.md test/compound_literals.sh
          git commit -m "Implement complete-type compound literals"
          git push
