name: Apply float core

on:
  push:
    branches:
      - agent/float-double-core
    paths:
      - tools/apply_float_core.py
      - .github/workflows/apply-float-core.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/float-double-core
      - name: Apply migration
        run: python3 tools/apply_float_core.py
      - name: Test migrated compiler
        run: make clean && make test
      - name: Commit migration
        run: |
          rm tools/apply_float_core.py .github/workflows/apply-float-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement scalar float and double core"
          git push origin HEAD:agent/float-double-core
