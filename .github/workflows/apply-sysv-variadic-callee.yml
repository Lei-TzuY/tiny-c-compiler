name: Apply SysV variadic callee migration

on:
  push:
    branches: [agent/sysv-variadic-callee]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sysv-variadic-callee
      - name: Apply migration
        run: python3 tools/apply_sysv_variadic.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm tools/apply_sysv_variadic.py
          rm .github/workflows/apply-sysv-variadic-callee.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Support SysV floating variadic callees"
          git push origin HEAD:agent/sysv-variadic-callee
