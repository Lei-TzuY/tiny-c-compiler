name: Apply ICE operand validation fix

on:
  push:
    branches:
      - fix/ice-dead-runtime-operands

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ice-dead-runtime-operands
          fetch-depth: 0
      - name: Patch evaluator
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('parse.c')
          s = p.read_text()
          start_marker = 'int64_t eval_const_expr(Node *node) {\n'
          end_marker = '\nstatic int64_t eval_enum_value'
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('eval_const_expr definition not found')
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('eval_enum_value marker not found')
          if 'static void validate_ice_operands(Node *node)' in s:
              raise SystemExit('helper already present')

          helper = r'''// Validate the complete syntax tree of an integer constant expression before
          // evaluating its value. C11 6.6 constrains operands even in subexpressions
          // skipped by &&, ||, or ?:; short-circuiting suppresses evaluation-time faults,
          // not the constant-expression operand restrictions.
          static void validate_ice_operands(Node *node) {
              if (!node)
                  error("expected integer constant expression");

              add_type(node);
              switch (node->kind) {
              case ND_NUM:
                  if (!node->ty || !is_integer(node->ty))
                      error("floating value is not an integer constant expression");
                  return;

              case ND_POS:
              case ND_NEG:
              case ND_BITNOT:
              case ND_NOT:
                  validate_ice_operands(node->lhs);
                  return;

              case ND_CAST:
                  if (!node->ty || !is_integer(node->ty))
                      error("cast does not produce an integer constant expression");
                  // C11 6.6p6 permits a floating constant only when it is the
                  // immediate operand of a cast to integer type.
                  if (node->lhs && node->lhs->kind == ND_NUM && node->lhs->ty &&
                      is_flonum(node->lhs->ty))
                      return;
                  validate_ice_operands(node->lhs);
                  return;

              case ND_ADD:
              case ND_SUB:
              case ND_MUL:
              case ND_DIV:
              case ND_MOD:
              case ND_BITAND:
              case ND_BITOR:
              case ND_BITXOR:
              case ND_SHL:
              case ND_SHR:
              case ND_EQ:
              case ND_NE:
              case ND_LT:
              case ND_LE:
              case ND_LOGAND:
              case ND_LOGOR:
                  validate_ice_operands(node->lhs);
                  validate_ice_operands(node->rhs);
                  return;

              case ND_TERNARY:
                  validate_ice_operands(node->cond);
                  validate_ice_operands(node->then);
                  validate_ice_operands(node->els);
                  return;

              case ND_COMMA:
                  // A comma operator may appear in an unevaluated subexpression;
                  // its operands must still be valid constant-expression operands.
                  validate_ice_operands(node->lhs);
                  validate_ice_operands(node->rhs);
                  return;

              default:
                  error("not an integer constant expression");
              }
          }

          '''

          chunk = s[start:end]
          chunk = chunk.replace('int64_t eval_const_expr(Node *node) {',
                                'static int64_t eval_const_expr_impl(Node *node) {', 1)
          chunk = chunk.replace('eval_const_expr(', 'eval_const_expr_impl(')
          wrapper = r'''
          int64_t eval_const_expr(Node *node) {
              validate_ice_operands(node);
              return eval_const_expr_impl(node);
          }
          '''
          s = s[:start] + helper + chunk + wrapper + s[end:]
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/patch-ice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c .github/workflows/patch-ice.yml
          git commit -m "Validate unevaluated ICE operands"
          git push origin HEAD:fix/ice-dead-runtime-operands
