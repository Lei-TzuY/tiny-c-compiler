name: Apply declarator-list migration

on:
  push:
    branches:
      - agent/declarator-lists

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/declarator-lists
      - name: Apply migration
        run: python3 tools/apply_declarator_lists.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f tools/apply_declarator_lists.py .github/workflows/apply-declarator-lists.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix declarator lists and incomplete globals"
          git push origin HEAD:agent/declarator-lists
