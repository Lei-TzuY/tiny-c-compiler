name: Apply typedef storage-class migration

on:
  push:
    branches:
      - agent/typedef-storage-class

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typedef-storage-class
          fetch-depth: 0
      - name: Apply typedef storage-class migration
        run: python3 tools/apply_typedef_storage_class.py
      - name: Apply typedef record-member constraint fix
        run: python3 tools/fix_typedef_record_member.py
      - name: Audit unified typedef declaration flow
        run: |
          grep -nE 'is_typedef|parse_typedef_declaration|typedef declaration requires|typedef declaration cannot|equal\(tok, "typedef"\)' parse.c | head -n 260
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c README.md Makefile test/typedef_storage_class.sh
          git commit -m "Unify typedef storage-class parsing"
          git push origin HEAD:agent/typedef-storage-class
