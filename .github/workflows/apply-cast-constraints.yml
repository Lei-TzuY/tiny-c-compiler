name: Apply cast constraint semantics migration

on:
  push:
    branches:
      - agent/cast-constraint-semantics

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cast-constraint-semantics
      - name: Apply migration
        run: python3 tools/apply_cast_constraints.py
      - name: Run full test suite
        run: make test
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parse.c Makefile README.md test/cast_constraints.sh
          git commit -m 'Enforce cast constraint semantics'
          git push
