name: Apply function pointer prototype migration

on:
  push:
    branches:
      - agent/function-pointer-prototypes

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/function-pointer-prototypes
      - name: Apply migration
        run: python3 tools/apply_function_pointer_prototypes.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f tools/apply_function_pointer_prototypes.py .github/workflows/apply-function-pointer-prototypes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retain function pointer prototype metadata"
          git push origin HEAD:agent/function-pointer-prototypes
