name: Apply source-relative quoted includes
on:
  push:
    branches:
      - agent/source-relative-quoted-includes
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_source_relative_includes.py
      - name: Test
        run: |
          make clean
          make test
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preprocess_v2.c Makefile README.md test/preprocessor_include_paths.sh
          git commit -m "Resolve quoted includes relative to source files"
          git push
