name: Apply static object alignment migration

on:
  push:
    branches:
      - agent/static-object-alignment

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python3 tools/apply_static_object_alignment.py

      - name: Run full test suite
        run: |
          make clean
          make test

      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codegen.c Makefile README.md test/static_object_alignment.sh
          git commit -m 'Honor static object alignment' || exit 0
          git push
