name: Apply long double implementation

on:
  push:
    branches: [feat/long-double]
    paths:
      - 'tools/migrate_long_double.py'
      - '.github/workflows/apply-long-double.yml'
      - 'test/long_double.sh'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/long-double
      - name: Apply implementation
        run: python3 tools/migrate_long_double.py
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minicc.h type.c tokenize.c parse.c codegen.c preprocess_v2.c Makefile README.md
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Implement x86-64 long double support'
          git push origin HEAD:feat/long-double
