name: Apply callable declarator migration

on:
  push:
    branches:
      - agent/arbitrary-callee-declarators

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arbitrary-callee-declarators
      - name: Apply migration
        run: python3 tools/apply_callable_declarators.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f tools/apply_callable_declarators.py .github/workflows/apply-callable-declarators.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support arbitrary callable expressions and abstract callbacks"
          git push origin HEAD:agent/arbitrary-callee-declarators
