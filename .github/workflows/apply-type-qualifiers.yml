name: Apply type qualifier migration

on:
  push:
    branches:
      - agent/type-qualifiers

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/type-qualifiers
      - name: Apply migration
        run: python3 tools/apply_type_qualifiers.py
      - name: Test compiler
        run: |
          make clean
          make test
      - name: Commit verified implementation
        run: |
          rm tools/apply_type_qualifiers.py
          rm .github/workflows/apply-type-qualifiers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minicc.h type.c parse.c Makefile README.md test/type_qualifiers.sh tools/apply_type_qualifiers.py .github/workflows/apply-type-qualifiers.yml
          git commit -m 'Implement const and volatile type qualifiers'
          git push origin HEAD:agent/type-qualifiers
