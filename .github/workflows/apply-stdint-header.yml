name: Apply C11 stdint header

on:
  push:
    branches:
      - agent/stdint-header
    paths:
      - tools/apply_stdint_header.py
      - test/stdint_header.sh
      - .github/workflows/apply-stdint-header.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stdint-header
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_stdint_header.py
      - name: Audit stdint header
        run: |
          grep -q '"stdint.h"' preprocess_v2.c
          grep -q 'typedef signed char int8_t' preprocess_v2.c
          grep -q 'typedef long intptr_t' preprocess_v2.c
          grep -q '#define INT64_MIN' preprocess_v2.c
          grep -q '#define UINT64_MAX' preprocess_v2.c
          grep -q '#define INT64_C(value) value ## L' preprocess_v2.c
          grep -q '#define UINTMAX_C(value) value ## ULL' preprocess_v2.c
          grep -q 'test/stdint_header.sh' Makefile
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated changes
        run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add preprocess_v2.c Makefile test/stdint_header.sh
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Support C11 stdint.h integer definitions'
          git push origin HEAD:agent/stdint-header
