name: Apply constexpr signed overflow
on:
  push:
    branches:
      - agent/constexpr-signed-overflow
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_constexpr_signed_overflow.py
      - name: Test
        run: |
          make clean
          make test
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c README.md test/constant_expressions.sh
          git commit -m "Diagnose signed constant-expression overflow"
          git push
