name: Finalize source-relative quoted includes v4
on:
  push:
    branches:
      - agent/source-relative-quoted-includes-v4
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest-main documentation and test wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Makefile')
          s = p.read_text()
          anchor = '\tbash ./test/preprocessor_char_constants.sh\n'
          if 'preprocessor_include_paths.sh' not in s:
              s = s.replace(anchor, anchor + '\tbash ./test/preprocessor_include_paths.sh\n', 1)
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text()
          old = '- **Preprocessor**: object-like and function-like macros, recursive expansion, direct and macro-expanded `#include`, `#define`, `#undef`, `#if/#elif/#else/#endif`, `#ifdef/#ifndef`, `defined`, variadic macros with `__VA_ARGS__`, stringification `#`, token pasting `##`, source line splicing, and `#error`'
          new = '- **Preprocessor**: object-like and function-like macros, recursive expansion, direct and macro-expanded `#include`, source-relative quoted-header lookup (including nested headers, independent of `#line` logical filenames), `#define`, `#undef`, `#if/#elif/#else/#endif`, `#ifdef/#ifndef`, `defined`, variadic macros with `__VA_ARGS__`, stringification `#`, token pasting `##`, source line splicing, and `#error`'
          if old not in s:
              raise SystemExit('README preprocessor bullet anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Test
        run: |
          make clean
          make test
      - name: Commit permanent files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile README.md
          git commit -m "Wire source-relative include regressions"
          git push
