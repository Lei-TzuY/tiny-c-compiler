name: Apply register addressability
on:
  push:
    branches:
      - agent/register-addressability
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_register_addressability.py
      - name: Test
        run: |
          make clean
          make test
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minicc.h parse.c Makefile README.md test/register_addressability.sh
          git commit -m "Enforce register object addressability"
          git push
