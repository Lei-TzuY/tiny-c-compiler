name: Apply preprocessor signedness fix

on:
  push:
    branches:
      - fix-pp-unsigned-intmax-semantics

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[unsigned-if-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pp-unsigned-intmax-semantics
      - name: Apply typed preprocessor integer evaluator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('preprocess_v2.c')
          text = path.read_text()
          start_marker = '// ---- #if expression evaluator ------------------------------------------------\n'
          end_marker = '// ---- Macro expansion ---------------------------------------------------------\n'
          start = text.index(start_marker)
          end = text.index(end_marker)
          section = r'''// ---- #if expression evaluator ------------------------------------------------

typedef struct {
    const char *p;
    int depth;
    bool suppress_eval;
} PPExpr;

typedef struct {
    uint64_t bits;
    bool is_unsigned;
} PPValue;

static PPValue pp_conditional(PPExpr *e);

static PPValue pp_value(uint64_t bits, bool is_unsigned) {
    return (PPValue){.bits = bits, .is_unsigned = is_unsigned};
}

static PPValue pp_signed_value(int64_t value) {
    return pp_value((uint64_t)value, false);
}

static PPValue pp_unsigned_value(uint64_t value) {
    return pp_value(value, true);
}

static bool pp_truth(PPValue value) {
    return value.bits != 0;
}

static int64_t pp_as_signed(PPValue value) {
    return (int64_t)value.bits;
}

static bool pp_common_unsigned(PPValue lhs, PPValue rhs) {
    return lhs.is_unsigned || rhs.is_unsigned;
}

static PPValue pp_bool_value(bool value) {
    return pp_signed_value(value ? 1 : 0);
}

static void pp_skip_space(PPExpr *e) {
    while (isspace((unsigned char)*e->p))
        e->p++;
}

static bool pp_consume(PPExpr *e, const char *op) {
    pp_skip_space(e);
    size_t n = strlen(op);
    if (strncmp(e->p, op, n))
        return false;
    e->p += n;
    return true;
}

static char *pp_read_ident(PPExpr *e) {
    pp_skip_space(e);
    if (!is_ident1_pp(*e->p))
        return NULL;
    const char *start = e->p++;
    while (is_ident2_pp(*e->p))
        e->p++;
    return strndup(start, (size_t)(e->p - start));
}

static int pp_hex_digit(char c) {
    if (c >= '0' && c <= '9') return c - '0';
    if (c >= 'a' && c <= 'f') return c - 'a' + 10;
    if (c >= 'A' && c <= 'F') return c - 'A' + 10;
    return -1;
}

static PPValue pp_read_char_constant(PPExpr *e) {
    pp_skip_space(e);
    const char *p = e->p;
    if (*p++ != '\'')
        error("internal error while reading #if character constant");
    if (!*p || *p == '\'' || *p == '\n')
        error("empty or unterminated character constant in #if expression");

    unsigned int value = 0;
    if (*p != '\\') {
        value = (unsigned char)*p++;
    } else {
        p++;
        if (!*p)
            error("unterminated escape in #if character constant");
        switch (*p) {
        case '\'': value = '\''; p++; break;
        case '"': value = '"'; p++; break;
        case '?': value = '?'; p++; break;
        case '\\': value = '\\'; p++; break;
        case 'a': value = '\a'; p++; break;
        case 'b': value = '\b'; p++; break;
        case 'f': value = '\f'; p++; break;
        case 'n': value = '\n'; p++; break;
        case 'r': value = '\r'; p++; break;
        case 't': value = '\t'; p++; break;
        case 'v': value = '\v'; p++; break;
        case 'x': {
            p++;
            int d = pp_hex_digit(*p);
            if (d < 0)
                error("hex escape in #if character constant requires a digit");
            while ((d = pp_hex_digit(*p)) >= 0) {
                if (value > (255u - (unsigned)d) / 16u)
                    error("character escape out of byte range in #if expression");
                value = value * 16u + (unsigned)d;
                p++;
            }
            break;
        }
        default:
            if (*p < '0' || *p > '7')
                error("unknown escape in #if character constant");
            for (int i = 0; i < 3 && *p >= '0' && *p <= '7'; i++) {
                unsigned d = (unsigned)(*p++ - '0');
                if (value > (255u - d) / 8u)
                    error("character escape out of byte range in #if expression");
                value = value * 8u + d;
            }
            break;
        }
    }

    if (*p != '\'')
        error("multi-character or unterminated character constant in #if expression");
    e->p = p + 1;
    return pp_signed_value((int64_t)value);
}

static PPValue eval_pp_expr_depth(const char *text, int depth, bool suppress_eval);
static PPValue pp_eval_function_macro(PPExpr *e, Macro *m);

static bool pp_integer_constant_is_unsigned(const char *start, uint64_t value,
                                            bool seen_u, int long_count) {
    if (seen_u)
        return true;

    bool decimal = *start != '0';
    if (decimal) {
        if (value > INT64_MAX)
            error("decimal integer constant is too large in #if expression");
        return false;
    }

    if (long_count > 0)
        return value > INT64_MAX;

    // For unsuffixed octal/hexadecimal constants the candidate sequence is
    // int, unsigned int, long, unsigned long, long long, unsigned long long.
    // On the LP64 target, values in the UINT32-only range therefore retain
    // unsigned provenance even though intmax_t could represent them.
    if (value <= INT32_MAX)
        return false;
    if (value <= UINT32_MAX)
        return true;
    if (value <= INT64_MAX)
        return false;
    return true;
}

static PPValue pp_primary(PPExpr *e) {
    pp_skip_space(e);
    const char *saved = e->p;
    char *ident = pp_read_ident(e);
    if (ident && !strcmp(ident, "defined")) {
        free(ident);
        bool paren = pp_consume(e, "(");
        char *name = pp_read_ident(e);
        if (!name)
            error("expected identifier after defined");
        if (paren && !pp_consume(e, ")"))
            error("expected ')' after defined");
        bool result = find_macro(name) != NULL;
        free(name);
        return pp_bool_value(result);
    }
    if (ident) {
        Macro *m = find_macro(ident);
        PPValue result = pp_signed_value(0);
        if (m && m->builtin == BUILTIN_MACRO_LINE) {
            result = pp_signed_value(current_pp_line);
        } else if (m && m->builtin == BUILTIN_MACRO_FILE) {
            error("__FILE__ expands to a string and is not valid in #if arithmetic");
        } else if (m && m->is_objlike && e->depth < 64) {
            result = eval_pp_expr_depth(m->body, e->depth + 1, e->suppress_eval);
        } else if (m && !m->is_objlike && e->depth < 64) {
            result = pp_eval_function_macro(e, m);
        }
        free(ident);
        return result;
    }
    e->p = saved;

    if (pp_consume(e, "(")) {
        PPValue val = pp_conditional(e);
        if (!pp_consume(e, ")"))
            error("expected ')' in #if expression");
        return val;
    }

    pp_skip_space(e);
    if (*e->p == '\'')
        return pp_read_char_constant(e);
    if (isdigit((unsigned char)*e->p)) {
        const char *number_start = e->p;
        char *end;
        errno = 0;
        unsigned long long val = strtoull(e->p, &end, 0);
        if (errno == ERANGE)
            error("integer constant is too large in #if expression");
        if (end == e->p)
            error("invalid number in #if expression");

        const char *suffix = end;
        bool seen_u = false;
        int long_count = 0;
        if (*suffix == 'u' || *suffix == 'U') {
            seen_u = true;
            suffix++;
        }
        if (*suffix == 'l' || *suffix == 'L') {
            char first = *suffix++;
            long_count = 1;
            if (*suffix == first) {
                suffix++;
                long_count = 2;
            }
        }
        if (!seen_u && (*suffix == 'u' || *suffix == 'U')) {
            seen_u = true;
            suffix++;
        }
        if (*suffix == 'u' || *suffix == 'U' || *suffix == 'l' || *suffix == 'L')
            error("invalid integer suffix in #if expression");
        e->p = suffix;

        bool is_unsigned = pp_integer_constant_is_unsigned(number_start, val,
                                                           seen_u, long_count);
        return pp_value((uint64_t)val, is_unsigned);
    }
    error("invalid #if expression near '%s'", e->p);
}

static PPValue pp_unary(PPExpr *e) {
    if (pp_consume(e, "!"))
        return pp_bool_value(!pp_truth(pp_unary(e)));
    if (pp_consume(e, "~")) {
        PPValue val = pp_unary(e);
        val.bits = ~val.bits;
        return val;
    }
    if (pp_consume(e, "+"))
        return pp_unary(e);
    if (pp_consume(e, "-")) {
        PPValue val = pp_unary(e);
        val.bits = 0 - val.bits;
        return val;
    }
    return pp_primary(e);
}

static PPValue pp_mul(PPExpr *e) {
    PPValue val = pp_unary(e);
    for (;;) {
        if (pp_consume(e, "*")) {
            PPValue rhs = pp_unary(e);
            bool uns = pp_common_unsigned(val, rhs);
            val = pp_value(val.bits * rhs.bits, uns);
        } else if (pp_consume(e, "/")) {
            PPValue rhs = pp_unary(e);
            bool uns = pp_common_unsigned(val, rhs);
            if (e->suppress_eval) {
                val = pp_value(0, uns);
                continue;
            }
            if (!rhs.bits)
                error("division by zero in #if expression");
            if (uns) {
                val = pp_unsigned_value(val.bits / rhs.bits);
            } else {
                int64_t lhs_s = pp_as_signed(val);
                int64_t rhs_s = pp_as_signed(rhs);
                if (lhs_s == INT64_MIN && rhs_s == -1)
                    error("signed division overflow in #if expression");
                val = pp_signed_value(lhs_s / rhs_s);
            }
        } else if (pp_consume(e, "%")) {
            PPValue rhs = pp_unary(e);
            bool uns = pp_common_unsigned(val, rhs);
            if (e->suppress_eval) {
                val = pp_value(0, uns);
                continue;
            }
            if (!rhs.bits)
                error("division by zero in #if expression");
            if (uns) {
                val = pp_unsigned_value(val.bits % rhs.bits);
            } else {
                int64_t lhs_s = pp_as_signed(val);
                int64_t rhs_s = pp_as_signed(rhs);
                if (lhs_s == INT64_MIN && rhs_s == -1)
                    val = pp_signed_value(0);
                else
                    val = pp_signed_value(lhs_s % rhs_s);
            }
        } else {
            return val;
        }
    }
}

static PPValue pp_add(PPExpr *e) {
    PPValue val = pp_mul(e);
    for (;;) {
        if (pp_consume(e, "+")) {
            PPValue rhs = pp_mul(e);
            val = pp_value(val.bits + rhs.bits, pp_common_unsigned(val, rhs));
        } else if (pp_consume(e, "-")) {
            PPValue rhs = pp_mul(e);
            val = pp_value(val.bits - rhs.bits, pp_common_unsigned(val, rhs));
        } else {
            return val;
        }
    }
}

static PPValue pp_shift(PPExpr *e) {
    PPValue val = pp_add(e);
    for (;;) {
        bool left = false;
        if (pp_consume(e, "<<"))
            left = true;
        else if (!pp_consume(e, ">>"))
            return val;

        PPValue rhs = pp_add(e);
        if (e->suppress_eval) {
            val.bits = 0;
            continue;
        }
        int64_t count = pp_as_signed(rhs);
        if (rhs.is_unsigned) {
            if (rhs.bits >= 64)
                error("invalid shift count in #if expression");
            count = (int64_t)rhs.bits;
        }
        if (count < 0 || count >= 64)
            error("invalid shift count in #if expression");
        if (left)
            val.bits <<= (unsigned)count;
        else if (val.is_unsigned)
            val.bits >>= (unsigned)count;
        else
            val.bits = (uint64_t)(pp_as_signed(val) >> (unsigned)count);
    }
}

static PPValue pp_rel(PPExpr *e) {
    PPValue val = pp_shift(e);
    for (;;) {
        enum { PP_NONE, PP_LE, PP_GE, PP_LT, PP_GT } op = PP_NONE;
        if (pp_consume(e, "<=")) op = PP_LE;
        else if (pp_consume(e, ">=")) op = PP_GE;
        else if (pp_consume(e, "<")) op = PP_LT;
        else if (pp_consume(e, ">")) op = PP_GT;
        else return val;

        PPValue rhs = pp_shift(e);
        if (e->suppress_eval) {
            val = pp_signed_value(0);
            continue;
        }
        bool uns = pp_common_unsigned(val, rhs);
        bool result;
        if (uns) {
            if (op == PP_LE) result = val.bits <= rhs.bits;
            else if (op == PP_GE) result = val.bits >= rhs.bits;
            else if (op == PP_LT) result = val.bits < rhs.bits;
            else result = val.bits > rhs.bits;
        } else {
            int64_t lhs_s = pp_as_signed(val);
            int64_t rhs_s = pp_as_signed(rhs);
            if (op == PP_LE) result = lhs_s <= rhs_s;
            else if (op == PP_GE) result = lhs_s >= rhs_s;
            else if (op == PP_LT) result = lhs_s < rhs_s;
            else result = lhs_s > rhs_s;
        }
        val = pp_bool_value(result);
    }
}

static PPValue pp_eq(PPExpr *e) {
    PPValue val = pp_rel(e);
    for (;;) {
        bool is_eq;
        if (pp_consume(e, "==")) is_eq = true;
        else if (pp_consume(e, "!=")) is_eq = false;
        else return val;

        PPValue rhs = pp_rel(e);
        if (e->suppress_eval) {
            val = pp_signed_value(0);
            continue;
        }
        bool result;
        if (pp_common_unsigned(val, rhs))
            result = val.bits == rhs.bits;
        else
            result = pp_as_signed(val) == pp_as_signed(rhs);
        val = pp_bool_value(is_eq ? result : !result);
    }
}

static PPValue pp_bitand(PPExpr *e) {
    PPValue val = pp_eq(e);
    for (;;) {
        pp_skip_space(e);
        if (e->p[0] == '&' && e->p[1] != '&') {
            e->p++;
            PPValue rhs = pp_eq(e);
            val = pp_value(val.bits & rhs.bits, pp_common_unsigned(val, rhs));
        } else {
            return val;
        }
    }
}

static PPValue pp_bitxor(PPExpr *e) {
    PPValue val = pp_bitand(e);
    while (pp_consume(e, "^")) {
        PPValue rhs = pp_bitand(e);
        val = pp_value(val.bits ^ rhs.bits, pp_common_unsigned(val, rhs));
    }
    return val;
}

static PPValue pp_bitor(PPExpr *e) {
    PPValue val = pp_bitxor(e);
    for (;;) {
        pp_skip_space(e);
        if (e->p[0] == '|' && e->p[1] != '|') {
            e->p++;
            PPValue rhs = pp_bitxor(e);
            val = pp_value(val.bits | rhs.bits, pp_common_unsigned(val, rhs));
        } else {
            return val;
        }
    }
}

static PPValue pp_logand(PPExpr *e) {
    PPValue val = pp_bitor(e);
    while (pp_consume(e, "&&")) {
        bool lhs_truth = pp_truth(val);
        bool saved = e->suppress_eval;
        if (!saved && !lhs_truth)
            e->suppress_eval = true;
        PPValue rhs = pp_bitor(e);
        e->suppress_eval = saved;
        if (saved)
            val = pp_signed_value(0);
        else
            val = pp_bool_value(lhs_truth && pp_truth(rhs));
    }
    return val;
}

static PPValue pp_logor(PPExpr *e) {
    PPValue val = pp_logand(e);
    while (pp_consume(e, "||")) {
        bool lhs_truth = pp_truth(val);
        bool saved = e->suppress_eval;
        if (!saved && lhs_truth)
            e->suppress_eval = true;
        PPValue rhs = pp_logand(e);
        e->suppress_eval = saved;
        if (saved)
            val = pp_signed_value(0);
        else
            val = pp_bool_value(lhs_truth || pp_truth(rhs));
    }
    return val;
}

static PPValue pp_conditional(PPExpr *e) {
    PPValue cond = pp_logor(e);
    if (!pp_consume(e, "?"))
        return cond;

    bool saved = e->suppress_eval;
    if (!saved && !pp_truth(cond))
        e->suppress_eval = true;
    PPValue then_val = pp_conditional(e);
    e->suppress_eval = saved;

    if (!pp_consume(e, ":"))
        error("expected ':' in #if conditional expression");

    if (!saved && pp_truth(cond))
        e->suppress_eval = true;
    PPValue else_val = pp_conditional(e);
    e->suppress_eval = saved;

    bool uns = pp_common_unsigned(then_val, else_val);
    if (saved)
        return pp_value(0, uns);
    PPValue selected = pp_truth(cond) ? then_val : else_val;
    selected.is_unsigned = uns;
    return selected;
}

static PPValue eval_pp_expr_depth(const char *text, int depth, bool suppress_eval) {
    PPExpr e = {.p = text, .depth = depth, .suppress_eval = suppress_eval};
    PPValue val = pp_conditional(&e);
    pp_skip_space(&e);
    if (*e.p)
        error("unexpected token in #if expression near '%s'", e.p);
    return val;
}

static bool eval_pp_expr(const char *text) {
    return pp_truth(eval_pp_expr_depth(text, 0, false));
}

'''
          text = text[:start] + section + text[end:]
          old_sig = 'static int64_t pp_eval_function_macro(PPExpr *e, Macro *m) {'
          new_sig = 'static PPValue pp_eval_function_macro(PPExpr *e, Macro *m) {'
          if text.count(old_sig) != 1:
              raise SystemExit('unexpected pp_eval_function_macro signature count')
          text = text.replace(old_sig, new_sig, 1)
          old_result = '    int64_t result = eval_pp_expr_depth(rescanned, e->depth + 1, e->suppress_eval);'
          new_result = '    PPValue result = eval_pp_expr_depth(rescanned, e->depth + 1, e->suppress_eval);'
          if text.count(old_result) != 1:
              raise SystemExit('unexpected pp_eval_function_macro result count')
          text = text.replace(old_result, new_result, 1)
          path.write_text(text)

          test = Path('test/preprocessor_integer_semantics.sh')
          test.write_text(r'''#!/bin/bash
set -e

assert_pp_integer() {
  expected="$1"
  input="$2"

  printf "%s\n" "$input" > tmp-pp-int-semantics.c
  "${MINICC:-./minicc}" tmp-pp-int-semantics.c > tmp-pp-int-semantics.s

  if command -v gcc >/dev/null; then
    gcc -o tmp-pp-int-semantics tmp-pp-int-semantics.s
  else
    as -o tmp-pp-int-semantics.o tmp-pp-int-semantics.s
    as -o tmp-pp-int-semantics-crt0.o test/crt0.s
    ld -o tmp-pp-int-semantics tmp-pp-int-semantics-crt0.o tmp-pp-int-semantics.o
  fi

  set +e
  ./tmp-pp-int-semantics
  actual="$?"
  set -e

  if [ "$actual" = "$expected" ]; then
    echo "OK(preprocessor-integer-semantics): $actual"
  else
    echo "FAIL(preprocessor-integer-semantics): expected $expected, got $actual"
    echo "$input"
    exit 1
  fi
}

assert_pp_integer_fail() {
  input="$1"
  printf "%s\n" "$input" > tmp-pp-int-semantics.c
  if "${MINICC:-./minicc}" tmp-pp-int-semantics.c > tmp-pp-int-semantics.s 2>/dev/null; then
    echo "FAIL(preprocessor-integer-semantics): expected preprocessing failure"
    echo "$input"
    exit 1
  fi
  echo "OK(preprocessor-integer-semantics): rejected invalid input"
}

# C11 6.10.1 evaluates signed/unsigned preprocessing integers as intmax_t and
# uintmax_t respectively. ULLONG_MAX must therefore remain unsigned rather
# than becoming signed -1 after parsing.
assert_pp_integer 51 '#if 18446744073709551615ULL > 0
int main() { return 51; }
#else
int main() { return 0; }
#endif'

# Usual arithmetic conversions apply when signed and unsigned operands mix.
assert_pp_integer 52 '#if -1 < 1ULL
int main() { return 0; }
#else
int main() { return 52; }
#endif'

assert_pp_integer 53 '#if (18446744073709551615ULL + 1) == 0
int main() { return 53; }
#else
int main() { return 0; }
#endif'

assert_pp_integer 54 '#if (18446744073709551615ULL / 3) == 6148914691236517205ULL
int main() { return 54; }
#else
int main() { return 0; }
#endif'

# Unsuffixed hexadecimal constants preserve the type selected by the target's
# integer-literal candidate sequence before preprocessing normalization.
assert_pp_integer 55 '#if 0xffffffff < -1
int main() { return 55; }
#else
int main() { return 0; }
#endif'

assert_pp_integer 56 '#if 0x100000000 > -1
int main() { return 56; }
#else
int main() { return 0; }
#endif'

# The conditional operator's result type considers both arms, including an
# unevaluated arm, so the selected -1 is converted to uintmax_t here.
assert_pp_integer 57 '#if (1 ? -1 : 1ULL) < 0
int main() { return 0; }
#else
int main() { return 57; }
#endif'

# Short-circuited unsigned expressions still avoid evaluating zero divisors.
assert_pp_integer 58 '#if 1 || (18446744073709551615ULL / 0)
int main() { return 58; }
#else
int main() { return 0; }
#endif'

# Decimal constants without U have no unsigned fallback candidate in C11.
assert_pp_integer_fail '#if 18446744073709551615
int main() { return 0; }
#endif'

echo "All preprocessor integer-semantics tests passed!"
''')

          makefile = Path('Makefile')
          mk = makefile.read_text()
          needle = '\tbash ./test/preprocessor_advanced.sh\n'
          addition = needle + '\tbash ./test/preprocessor_integer_semantics.sh\n'
          if 'preprocessor_integer_semantics.sh' not in mk:
              if needle not in mk:
                  raise SystemExit('preprocessor test insertion point missing')
              mk = mk.replace(needle, addition, 1)
              makefile.write_text(mk)
          PY
      - name: Run complete regression suite
        run: make clean && make test
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c Makefile test/preprocessor_integer_semantics.sh
          git commit -m 'Fix #if signed and unsigned integer semantics [unsigned-if-applied]'
          git push origin HEAD:fix-pp-unsigned-intmax-semantics
