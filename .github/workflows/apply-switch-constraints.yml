name: Apply switch constraint semantics migration

on:
  push:
    branches:
      - agent/switch-constraint-semantics
    paths:
      - tools/apply_switch_constraint_semantics.py
      - .github/workflows/apply-switch-constraints.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/switch-constraint-semantics
      - name: Apply migration
        run: python3 tools/apply_switch_constraint_semantics.py
      - name: Run full test suite
        run: make test
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parse.c codegen.c Makefile README.md test/switch_constraints.sh
          git commit -m 'Enforce switch constraint semantics'
          git push origin HEAD:agent/switch-constraint-semantics
