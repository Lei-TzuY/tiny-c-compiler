name: PP line migration
on:
  push:
    branches: [fix-pp-line-directive-v2]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pp-line-directive-v2
      - name: Apply #line implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('preprocess_v2.c')
          s = p.read_text()
          if 'int line_offset = 0;' not in s:
              old = '''    char *p = spliced;\n    int line_no = 0;\n    while (*p) {\n        line_no++;\n        current_pp_file = source_name ? source_name : "<stdin>";\n        current_pp_line = line_no;\n'''
              new = '''    char *p = spliced;\n    int line_no = 0;\n    int line_offset = 0;\n    char *logical_file = strdup(source_name ? source_name : "<stdin>");\n    while (*p) {\n        line_no++;\n        current_pp_file = logical_file;\n        current_pp_line = line_no + line_offset;\n'''
              if old not in s:
                  raise SystemExit('preprocessor loop anchor not found')
              s = s.replace(old, new, 1)
              old = '''            } else if (is_cond_active() && !strcmp(directive, "error")) {\n                error("#error %s", start);\n            }\n'''
              new = '''            } else if (is_cond_active() && !strcmp(directive, "line")) {\n                // C11 #line operands are macro-expanded before interpretation.\n                bool directive_comment = false;\n                char *expanded = expand_text(start, NULL, &directive_comment);\n                char *q = expanded;\n                while (*q == ' ' || *q == '\\t') q++;\n                char *end = NULL;\n                long requested = strtol(q, &end, 10);\n                if (end == q || requested <= 0 || requested > 2147483647L)\n                    error("#line requires a positive decimal line number");\n                q = end;\n                while (*q == ' ' || *q == '\\t') q++;\n                if (*q) {\n                    if (*q != '\"')\n                        error("#line filename must be a string literal");\n                    char *name_start = ++q;\n                    while (*q && *q != '\"') q++;\n                    if (!*q)\n                        error("unterminated #line filename");\n                    char *next_file = strndup(name_start, (size_t)(q - name_start));\n                    q++;\n                    while (*q == ' ' || *q == '\\t') q++;\n                    if (*q)\n                        error("extra tokens after #line directive");\n                    free(logical_file);\n                    logical_file = next_file;\n                }\n                line_offset = (int)requested - (line_no + 1);\n                free(expanded);\n            } else if (is_cond_active() && !strcmp(directive, "error")) {\n                error("#error %s", start);\n            }\n'''
              if old not in s:
                  raise SystemExit('#error anchor not found')
              s = s.replace(old, new, 1)
              old = '''    preprocess_depth--;\n    current_pp_file = saved_file;\n    current_pp_line = saved_line;\n    return out.data;\n'''
              new = '''    preprocess_depth--;\n    current_pp_file = saved_file;\n    current_pp_line = saved_line;\n    free(logical_file);\n    return out.data;\n'''
              if old not in s:
                  raise SystemExit('preprocessor cleanup anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Add #line regressions
        run: |
          if grep -q 'All #line directive tests passed' test/predefined_source_macros.sh; then exit 0; fi
          cat >> test/predefined_source_macros.sh <<'SH'

          cat > tmp-line-remap-header.h <<'EOF'
          #line 40 "virtual-header.h"
          int remapped_header_line(void) { return __LINE__; }
          const char *remapped_header_file(void) { return __FILE__; }
          EOF

          cat > tmp-line-remap.c <<'EOF'
          #define TARGET_LINE 200
          #define TARGET_FILE "generated-input.c"
          #line TARGET_LINE TARGET_FILE
          int remapped_line = __LINE__;
          const char *remapped_file = __FILE__;
          #include "tmp-line-remap-header.h"
          int streq2(const char *a, const char *b) {
            while (*a && *a == *b) { a++; b++; }
            return *a == *b;
          }
          #line 700
          int second_line = __LINE__;
          #line 900
          #if __LINE__ != 900
          #error #line must affect __LINE__ in conditionals
          #endif
          int main(void) {
            if (remapped_line != 200) return 1;
            if (!streq2(remapped_file, "generated-input.c")) return 2;
            if (remapped_header_line() != 40) return 3;
            if (!streq2(remapped_header_file(), "virtual-header.h")) return 4;
            if (second_line != 700) return 5;
            if (!streq2(__FILE__, "generated-input.c")) return 6;
            return 0;
          }
          EOF
          ./minicc tmp-line-remap.c > tmp-line-remap.s
          cc -o tmp-line-remap tmp-line-remap.s
          ./tmp-line-remap
          echo "OK(predefined source macros): #line remaps line/file and include context"
          rm -f tmp-line-remap-header.h tmp-line-remap.c tmp-line-remap.s tmp-line-remap
          echo 'All #line directive tests passed!'
          SH
      - name: Run full test suite
        run: make test
      - name: Commit migration result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c test/predefined_source_macros.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Support standard #line directive'
          git push origin HEAD:fix-pp-line-directive-v2
