name: Union designator migration

on:
  push:
    branches:
      - agent/union-designator-overrides-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/union-designator-overrides-v2
      - name: Apply patch
        run: python3 tools/apply_union_designator_overrides.py
      - name: Test
        run: make clean && make test
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add parse.c test/union_initializers.sh README.md
          git diff --cached --quiet && exit 0
          git commit -m "Support union designated initializer overrides"
          git push
