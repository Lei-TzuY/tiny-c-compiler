name: Apply static floating constexpr migration

on:
  push:
    branches:
      - agent/static-floating-constexpr

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/static-floating-constexpr
      - name: Apply migration
        run: python3 tools/apply_static_floating_constexpr.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm tools/apply_static_floating_constexpr.py
          rm .github/workflows/apply-static-floating-constexpr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Support static floating constant expressions'
          git push origin HEAD:agent/static-floating-constexpr
