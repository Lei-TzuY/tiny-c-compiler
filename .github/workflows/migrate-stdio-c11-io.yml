name: Migrate stdio C11 I/O

on:
  push:
    branches:
      - feat/stdio-c11-io

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stdio-c11-io
          fetch-depth: 0
      - name: Apply stdio expansion
        run: python3 tools/migrate_stdio_c11_io.py
      - name: Commit migrated sources
        run: |
          if git diff --quiet -- preprocess_v2.c test/stdio_header.sh; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c test/stdio_header.sh
          git commit -m 'Expand C11 stdio.h I/O declarations'
          git push origin HEAD:feat/stdio-c11-io
