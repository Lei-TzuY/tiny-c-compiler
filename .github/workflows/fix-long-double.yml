name: Fix long double implementation

on:
  push:
    branches: [feat/long-double]
    paths:
      - 'tools/fix_long_double.py'
      - '.github/workflows/fix-long-double.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/long-double
      - run: python3 tools/fix_long_double.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codegen.c
          git commit -m 'Fix long double post increment stack discipline'
          git push origin HEAD:feat/long-double
