name: Apply macro include fix

on:
  push:
    branches:
      - fix-macro-expanded-include

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-macro-expanded-include
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/apply_macro_include_fix.py
      - name: Run full test suite
        run: make clean && make test
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c test/preprocessor.sh README.md
          git commit -m "Support macro-expanded include operands"
          git push origin HEAD:fix-macro-expanded-include
