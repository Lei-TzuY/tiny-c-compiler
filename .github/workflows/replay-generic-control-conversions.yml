name: Replay generic control conversions
on:
  push:
    branches:
      - agent/generic-control-conversions-v4
permissions:
  contents: write
jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply replay
        run: python3 tools/apply_generic_control_conversions.py
      - name: Test
        run: |
          make clean
          make test
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c README.md test/generic_selection.sh
          git commit -m "Apply generic controlling expression conversions"
          git push
