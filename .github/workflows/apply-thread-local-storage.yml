name: Apply C11 thread-local storage

on:
  push:
    branches:
      - agent/thread-local-storage
    paths:
      - tools/apply_thread_local_storage.py
      - .github/workflows/apply-thread-local-storage.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/thread-local-storage
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_thread_local_storage.py
      - name: Audit TLS implementation
        run: |
          grep -q 'bool is_thread_local' minicc.h
          grep -q '"_Thread_local"' tokenize.c
          grep -q 'is_thread_local' parse.c
          grep -q '@tpoff' codegen.c
          grep -q '\.section \.tdata' codegen.c
          grep -q '\.section \.tbss' codegen.c
          grep -q 'pthread_create' test/thread_local.sh
          grep -q 'readelf -sW' test/thread_local.sh
          grep -q 'test/thread_local.sh' Makefile
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add minicc.h tokenize.c parse.c codegen.c Makefile README.md test/thread_local.sh
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Implement C11 thread-local storage'
          git push origin HEAD:agent/thread-local-storage
