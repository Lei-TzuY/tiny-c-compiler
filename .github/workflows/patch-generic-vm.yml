name: Patch generic VM associations

on:
  push:
    branches: [fix-generic-vm-associations]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-generic-vm-associations
      - run: python3 .github/apply-generic-vm.py
      - run: |
          rm .github/apply-generic-vm.py .github/workflows/patch-generic-vm.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Reject variably modified _Generic associations"
          git push origin HEAD:fix-generic-vm-associations
