name: Automation relational pointer compatibility

on:
  push:
    branches: [fix/relational-pointer-compatibility]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 automation_patch.py
      - name: Run full test suite
        run: make test
      - name: Commit verified patch
        run: |
          rm -f automation_patch.py .github/workflows/automation-relational-pointer-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Enforce compatible relational pointer operands'
          git push origin HEAD:fix/relational-pointer-compatibility
