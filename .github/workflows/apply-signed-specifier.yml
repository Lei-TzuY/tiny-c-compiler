name: Apply signed specifier migration

on:
  push:
    branches:
      - agent/signed-type-specifier

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/signed-type-specifier
          fetch-depth: 0
      - name: Apply signed specifier migration
        run: python3 tools/apply_signed_specifier.py
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c tokenize.c README.md Makefile test/signed_specifiers.sh
          git commit -m "Support signed integer type specifiers"
          git push origin HEAD:agent/signed-type-specifier
