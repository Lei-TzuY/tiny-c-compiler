name: Apply C11 _Noreturn migration

on:
  push:
    branches:
      - agent/c11-noreturn

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c11-noreturn
          fetch-depth: 0
      - name: Apply C11 _Noreturn migration
        run: python3 tools/apply_c11_noreturn.py
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c tokenize.c preprocess_v2.c README.md Makefile test/noreturn.sh
          git commit -m "Support C11 _Noreturn and stdnoreturn.h"
          git push origin HEAD:agent/c11-noreturn
