name: Apply rebased SysV integer record ABI

on:
  push:
    branches:
      - agent/sysv-integer-record-abi-v2

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse verified backend lowering
        run: |
          git fetch origin agent/sysv-integer-record-abi
          git diff 5e46cc8bb838843bbfba996d9a7c70a0480ad67c 27679dd42cad7b362329efa27571e1fbbed6139a -- codegen.c minicc.h | git apply --3way
          git show 27679dd42cad7b362329efa27571e1fbbed6139a:test/sysv_record_abi.sh > test/sysv_record_abi.sh
      - name: Rebase firewall and shared classifier
        run: python3 tools/refine_sysv_integer_record_abi.py
      - name: Run full test suite
        run: |
          make clean
          make test
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minicc.h type.c parse.c codegen.c Makefile README.md test/record_abi_firewall.sh test/sysv_record_abi.sh
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Support SysV integer-class record ABI'
          git push
