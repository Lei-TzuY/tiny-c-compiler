name: Apply empty tag-definition constraints

on:
  push:
    branches:
      - agent/reject-empty-tag-definitions

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reject-empty-tag-definitions
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_reject_empty_tag_definitions.py
      - name: Audit grammar constraints
        run: |
          grep -n -B 3 -A 5 'definition requires at least one' parse.c
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c Makefile README.md test/tag_definition_constraints.sh
          git commit -m "Reject empty C11 tag definitions"
          git push origin HEAD:agent/reject-empty-tag-definitions
