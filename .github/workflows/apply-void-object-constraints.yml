name: Apply void-object constraint migration

on:
  push:
    branches:
      - agent/void-object-constraints

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/void-object-constraints
          fetch-depth: 0
      - name: Apply void-object constraint migration
        run: python3 tools/apply_void_object_constraints.py
      - name: Audit object declaration constraints
        run: |
          grep -nE 'object cannot have void type|record member cannot have|is_incomplete_object_type|TY_VOID|TY_FUNC' parse.c | head -n 260
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c README.md Makefile test/void_object_constraints.sh
          git commit -m "Reject invalid void object declarations"
          git push origin HEAD:agent/void-object-constraints
