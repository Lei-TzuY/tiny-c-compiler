name: Apply ICE operand validation fix

on:
  push:
    branches:
      - fix/ice-dead-runtime-operands

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply ICE operand validation fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ice-dead-runtime-operands
          fetch-depth: 0
      - name: Patch evaluator
        shell: python
        run: |
          from pathlib import Path
          p = Path('parse.c')
          s = p.read_text()
          needle = 'int64_t eval_const_expr(Node *node) {\n'
          helper = r'''// Validate the complete syntax tree of an integer constant expression before
// evaluating its value. C11 6.6 constrains operands even in subexpressions
// skipped by &&, ||, or ?:; short-circuiting suppresses evaluation-time faults,
// not the constant-expression operand restrictions.
static void validate_ice_operands(Node *node) {
    if (!node)
        error("expected integer constant expression");

    add_type(node);
    switch (node->kind) {
    case ND_NUM:
        if (!node->ty || !is_integer(node->ty))
            error("floating value is not an integer constant expression");
        return;

    case ND_POS:
    case ND_NEG:
    case ND_BITNOT:
    case ND_NOT:
        validate_ice_operands(node->lhs);
        return;

    case ND_CAST:
        if (!node->ty || !is_integer(node->ty))
            error("cast does not produce an integer constant expression");
        // A floating constant is permitted only as the immediate operand of a
        // cast to integer type (C11 6.6p6).
        if (node->lhs && node->lhs->kind == ND_NUM && node->lhs->ty &&
            is_flonum(node->lhs->ty))
            return;
        validate_ice_operands(node->lhs);
        return;

    case ND_ADD:
    case ND_SUB:
    case ND_MUL:
    case ND_DIV:
    case ND_MOD:
    case ND_BITAND:
    case ND_BITOR:
    case ND_BITXOR:
    case ND_SHL:
    case ND_SHR:
    case ND_EQ:
    case ND_NE:
    case ND_LT:
    case ND_LE:
    case ND_LOGAND:
    case ND_LOGOR:
        validate_ice_operands(node->lhs);
        validate_ice_operands(node->rhs);
        return;

    case ND_TERNARY:
        validate_ice_operands(node->cond);
        validate_ice_operands(node->then);
        validate_ice_operands(node->els);
        return;

    case ND_COMMA:
        // C11 6.6p3 permits a comma operator when it occurs only inside an
        // unevaluated subexpression. Its operands still have to be admissible.
        validate_ice_operands(node->lhs);
        validate_ice_operands(node->rhs);
        return;

    default:
        error("not an integer constant expression");
    }
}

'''
          if needle not in s:
              raise SystemExit('eval_const_expr definition not found')
          if 'static void validate_ice_operands(Node *node)' in s:
              raise SystemExit('helper already present')
          s = s.replace(needle, helper + needle, 1)
          old = '''int64_t eval_const_expr(Node *node) {
    if (!node)
        error("expected integer constant expression");

    add_type(node);
'''
          new = '''int64_t eval_const_expr(Node *node) {
    if (!node)
        error("expected integer constant expression");

    validate_ice_operands(node);
    add_type(node);
'''
          if old not in s:
              raise SystemExit('eval_const_expr prologue not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/patch-ice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c .github/workflows/patch-ice.yml
          git commit -m "Validate unevaluated ICE operands"
          git push origin HEAD:fix/ice-dead-runtime-operands
