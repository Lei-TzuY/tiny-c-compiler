name: Apply labeled statement constraints

on:
  push:
    branches:
      - agent/labeled-statement-declarations

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/labeled-statement-declarations
          fetch-depth: 0
      - name: Apply labeled-statement migration
        run: python3 tools/apply_labeled_statement_constraints.py
      - name: Audit labeled-statement grammar gate
        run: |
          grep -n -B 6 -A 16 'require_statement_after_label' parse.c | head -n 120
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c README.md test/control_flow_context.sh
          git commit -m "Require statements after C11 labels"
          git push origin HEAD:agent/labeled-statement-declarations
