name: Apply VLA compound literal fix

on:
  push:
    branches:
      - fix-vla-compound-literals

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-vla-compound-literals
      - name: Apply focused parser and regression changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          parse = Path("parse.c")
          text = parse.read_text()
          needle = '''    if (is_incomplete_object_type(ty) &&
              !is_unknown_bound_array_with_complete_element(ty))
              error_at(type_tok->loc,
                       "compound literal requires a complete object type or an unknown-bound array with complete element type");
          '''
          replacement = needle + '''    if (ty->kind == TY_ARRAY && ty->is_vla)
              error_at(type_tok->loc,
                       "compound literal may not have variable length array type");
          '''
          if text.count(needle) != 1:
              raise SystemExit(f"expected one compound-literal validation site, found {text.count(needle)}")
          parse.write_text(text.replace(needle, replacement))

          test = Path("test/compound_literals.sh")
          text = test.read_text()
          needle = '''assert_run 98 'char *p=(char[]){"abc"}; int main(){return p[1];}'
          assert_reject 'int main(){return (int){1,2};}'
          '''
          replacement = '''assert_run 98 'char *p=(char[]){"abc"}; int main(){return p[1];}'

          # C11 initialization constraints forbid VLA compound-literal objects.
          # A variably modified pointer object is not itself a VLA and remains valid.
          assert_reject 'int main(){int n=3; return (int[n]){1,2,3}[0];}'
          assert_reject 'int main(){int n=2; typedef int V[n]; return (V){4,5}[1];}'
          assert_run 0 'int main(){int n=3; int (*p)[n]=(int (*)[n]){0}; return p!=0;}'

          assert_reject 'int main(){return (int){1,2};}'
          '''
          if text.count(needle) != 1:
              raise SystemExit(f"expected one compound-literal test insertion site, found {text.count(needle)}")
          test.write_text(text.replace(needle, replacement))

          Path(".github/workflows/apply-vla-compound-fix.yml").unlink()
          PY
      - name: Verify full suite
        run: |
          git diff --check
          make test
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject VLA compound literals"
          git push origin HEAD:fix-vla-compound-literals
