name: Apply nested-brace designators v2

on:
  push:
    branches:
      - agent/nested-brace-designators-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nested-brace-designators-v2
          fetch-depth: 0

      - name: Restore verified migration helpers
        run: |
          mkdir -p tools
          git show 67e43676d5a32dc92d6f2c437ba2747c7201ba78:tools/apply_nested_brace_designators.py > tools/apply_nested_brace_designators.py
          git show 67e43676d5a32dc92d6f2c437ba2747c7201ba78:tools/run_nested_brace_designators_v2.py > tools/run_nested_brace_designators_v2.py

      - name: Apply migration
        run: python3 tools/run_nested_brace_designators_v2.py

      - name: Test compiler
        run: make clean && make test

      - name: Commit verified implementation
        run: |
          rm -f tools/apply_nested_brace_designators.py
          rm -f tools/run_nested_brace_designators_v2.py
          rm -f .github/workflows/apply-nested-brace-designators-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c Makefile README.md test/nested_brace_designators.sh .github/workflows/apply-nested-brace-designators-v2.yml
          git commit -m "Support nested-brace designated initializers"
          git push origin HEAD:agent/nested-brace-designators-v2
