name: Temporary PP function macro migration

on:
  push:
    branches:
      - fix/pp-function-macros-if

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/migrate_pp_if_function_macros.py
      - name: Build and test
        run: |
          make clean
          make test
      - name: Commit migrated files
        run: |
          if git diff --quiet -- preprocess_v2.c test/preprocessor_advanced.sh; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preprocess_v2.c test/preprocessor_advanced.sh
          git commit -m "Expand function-like macros in preprocessor conditions"
          git push
