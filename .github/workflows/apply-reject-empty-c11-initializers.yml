name: Apply empty C11 initializer constraints

on:
  push:
    branches:
      - agent/reject-empty-c11-initializers

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reject-empty-c11-initializers
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_reject_empty_c11_initializers.py
      - name: Audit constraint sites
        run: |
          grep -n -B 4 -A 8 'empty aggregate initializer is not valid in C11' parse.c
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c Makefile README.md test/empty_initializer_constraints.sh
          git commit -m "Reject empty aggregate initializers in C11 mode"
          git push origin HEAD:agent/reject-empty-c11-initializers
