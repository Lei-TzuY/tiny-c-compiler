name: Apply semantic assignment migration

on:
  push:
    branches: [agent/semantic-assignments]
    paths:
      - tools/apply-semantic-assignments.py
      - .github/workflows/apply-semantic-assignments.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-assignments
      - name: Apply migration
        run: |
          sed -i 's/rep(old_arg_indented, new_arg_indented, 2)/rep(old_arg_indented, new_arg_indented, 1)/' tools/apply-semantic-assignments.py
          python3 tools/apply-semantic-assignments.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('parse.c')
          s = p.read_text()
          old = '''                if (expected) {
                    if (is_numeric(arg->ty) && is_numeric(expected->ty) &&
                        arg->ty != expected->ty) {
'''
          new = '''                if (expected) {
                    if (!assignment_compatible(expected->ty, arg))
                        error_at(tok->loc, "incompatible argument type");
                    if (is_numeric(arg->ty) && is_numeric(expected->ty) &&
                        arg->ty != expected->ty) {
'''
          if s.count(old) != 1:
              raise SystemExit(f'direct-call argument anchor count={s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm tools/apply-semantic-assignments.py
          rm .github/workflows/apply-semantic-assignments.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce assignment conversion semantics'
          git push origin agent/semantic-assignments
