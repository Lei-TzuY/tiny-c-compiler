name: Apply static floating constexpr migration

on:
  push:
    branches:
      - agent/static-floating-constexpr

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/static-floating-constexpr
      - name: Fix migration function range
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_static_floating_constexpr.py')
          s = p.read_text()
          old = "end = s.index('\\nstatic void parse_static_scalar_initializer', start)"
          new = """brace = s.index('{', start)\ndepth = 0\nend = None\nfor i in range(brace, len(s)):\n    if s[i] == '{':\n        depth += 1\n    elif s[i] == '}':\n        depth -= 1\n        if depth == 0:\n            end = i + 1\n            break\nif end is None:\n    raise SystemExit('unterminated parse_const_double')"""
          if old not in s:
              raise SystemExit('migration range anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply migration
        run: python3 tools/apply_static_floating_constexpr.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm tools/apply_static_floating_constexpr.py
          rm .github/workflows/apply-static-floating-constexpr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Support static floating constant expressions'
          git push origin HEAD:agent/static-floating-constexpr
