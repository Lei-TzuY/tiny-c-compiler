name: Apply aggregate brace elision migration

on:
  push:
    branches:
      - agent/aggregate-brace-elision

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aggregate-brace-elision
      - name: Apply migration
        run: python3 tools/apply_aggregate_brace_elision.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm tools/apply_aggregate_brace_elision.py
          rm .github/workflows/apply-aggregate-brace-elision.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Support aggregate brace elision'
          git push origin HEAD:agent/aggregate-brace-elision
