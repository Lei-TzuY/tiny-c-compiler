name: Apply Alignas migration
on:
  push:
    branches: [agent/c11-alignas]
    paths:
      - apply-alignas.py
      - .github/workflows/apply-alignas.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c11-alignas
          fetch-depth: 0
      - name: Apply migration
        run: python3 apply-alignas.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm apply-alignas.py .github/workflows/apply-alignas.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Support C11 _Alignas declarations'
          git push origin HEAD:agent/c11-alignas
