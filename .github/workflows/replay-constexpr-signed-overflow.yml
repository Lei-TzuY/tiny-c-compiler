name: Replay constexpr signed overflow
on:
  push:
    branches:
      - agent/constexpr-signed-overflow-v2
permissions:
  contents: write
jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay validated permanent patch
        run: |
          git fetch origin agent/constexpr-signed-overflow
          git diff --binary 8b068ff6cb18b723a90ad0ec408fef40f9887578 8b1c29209accde64fcf67daa14c107b959eea3ee -- parse.c README.md test/constant_expressions.sh > /tmp/constexpr-overflow.patch
          git apply -3 /tmp/constexpr-overflow.patch
      - name: Test
        run: |
          make clean
          make test
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c README.md test/constant_expressions.sh
          git commit -m "Diagnose signed constant-expression overflow"
          git push
