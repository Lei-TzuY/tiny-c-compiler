name: Apply type-specifier validation migration

on:
  push:
    branches:
      - agent/type-specifier-validation

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/type-specifier-validation
          fetch-depth: 0
      - name: Apply type-specifier validation migration
        run: python3 tools/apply_type_specifier_validation.py
      - name: Audit type-specifier parser
        run: |
          grep -nE 'TypeSpecState|note_type_specifier|validate_type_specifier_set|saw_signed|saw_unsigned|n_long|n_named' parse.c | head -n 260
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c README.md Makefile test/type_specifier_combinations.sh
          git commit -m "Validate C type specifier combinations"
          git push origin HEAD:agent/type-specifier-validation
