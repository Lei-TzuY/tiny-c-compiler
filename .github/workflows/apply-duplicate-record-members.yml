name: Apply duplicate record-member constraints

on:
  push:
    branches:
      - agent/duplicate-record-members

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/duplicate-record-members
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_duplicate_record_members.py
      - name: Audit member constraint
        run: grep -n -B 4 -A 8 'duplicate record member name' parse.c
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c Makefile README.md test/duplicate_record_members.sh
          git commit -m "Reject duplicate record member names"
          git push origin HEAD:agent/duplicate-record-members
