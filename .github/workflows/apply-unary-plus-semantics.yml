name: Apply unary plus semantics
on:
  push:
    branches:
      - fix-unary-plus-semantics
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-unary-plus-semantics
      - name: Apply migration
        run: python3 tools/apply_unary_plus_semantics.py
      - name: Run full test suite
        run: make clean && make test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minicc.h parse.c type.c codegen.c Makefile test/unary_plus.sh
          git diff --cached --quiet && exit 0
          git commit -m "Enforce unary plus arithmetic semantics"
          git push origin HEAD:fix-unary-plus-semantics
