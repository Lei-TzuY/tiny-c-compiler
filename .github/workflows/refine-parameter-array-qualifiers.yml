name: Refine parameter array qualifiers
on:
  push:
    branches:
      - agent/parameter-array-qualifiers
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply refinement
        run: python3 tools/refine_parameter_array_qualifiers.py
      - name: Test
        run: make clean && make test
      - name: Commit permanent refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c test/parameter_array_qualifiers.sh
          git diff --cached --quiet && exit 0
          git commit -m "Handle grouped parameter array declarators"
          git push
