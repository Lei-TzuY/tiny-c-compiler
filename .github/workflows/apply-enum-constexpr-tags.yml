name: Apply enum constexpr/tag migration

on:
  push:
    branches:
      - agent/enum-constexpr-tags

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enum-constexpr-tags
      - name: Apply migration
        run: python3 tools/apply_enum_constexpr_tags.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f tools/apply_enum_constexpr_tags.py .github/workflows/apply-enum-constexpr-tags.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add enum constant expressions and typed tag namespace"
          git push origin HEAD:agent/enum-constexpr-tags
