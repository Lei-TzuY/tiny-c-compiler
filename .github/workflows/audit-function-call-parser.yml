name: Apply function declaration-before-use migration

on:
  push:
    branches:
      - agent/function-declaration-before-use

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/function-declaration-before-use
          fetch-depth: 0
      - name: Apply declaration-before-use migration
        run: python3 tools/apply_function_declaration_before_use.py
      - name: Audit call-site diagnostics
        run: |
          grep -n -B 10 -A 32 'call to undeclared function' parse.c | head -n 100
          if grep -q 'program_has_function_symbol' semantic_validate.c; then
            echo 'stale TU-end unresolved-call validator remains'
            exit 1
          fi
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c semantic_validate.c README.md test/unresolved_function_calls.sh
          git commit -m "Require function declarations before direct calls"
          git push origin HEAD:agent/function-declaration-before-use
