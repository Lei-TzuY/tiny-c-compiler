name: PP line migration
on:
  push:
    branches: [fix-pp-line-directive]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pp-line-directive
      - name: Apply #line implementation and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('preprocess_v2.c')
          s = p.read_text()
          old = '''    char *p = spliced;\n    int line_no = 0;\n    while (*p) {\n        line_no++;\n        current_pp_file = source_name ? source_name : "<stdin>";\n        current_pp_line = line_no;\n'''
          new = '''    char *p = spliced;\n    int line_no = 0;\n    int line_offset = 0;\n    char *logical_file = strdup(source_name ? source_name : "<stdin>");\n    while (*p) {\n        line_no++;\n        current_pp_file = logical_file;\n        current_pp_line = line_no + line_offset;\n'''
          if old not in s:
              raise SystemExit('preprocessor loop anchor not found')
          s = s.replace(old, new, 1)

          old = '''            } else if (is_cond_active() && !strcmp(directive, "error")) {\n                error("#error %s", start);\n            }\n'''
          new = '''            } else if (is_cond_active() && !strcmp(directive, "line")) {\n                // C11 6.10.4: macro-expand the directive operands, then make\n                // the following physical source line appear as the requested\n                // logical line.  An optional string literal also replaces the\n                // presumed source file used by __FILE__.\n                bool directive_comment = false;\n                char *expanded = expand_text(start, NULL, &directive_comment);\n                char *q = expanded;\n                while (*q == ' ' || *q == '\\t') q++;\n\n                char *end = NULL;\n                long requested = strtol(q, &end, 10);\n                if (end == q || requested <= 0 || requested > 2147483647L)\n                    error("#line requires a positive decimal line number");\n                q = end;\n                while (*q == ' ' || *q == '\\t') q++;\n\n                if (*q) {\n                    if (*q != '\"')\n                        error("#line filename must be a string literal");\n                    char *name_start = ++q;\n                    while (*q && *q != '\"') q++;\n                    if (!*q)\n                        error("unterminated #line filename");\n                    char *next_file = strndup(name_start, (size_t)(q - name_start));\n                    q++;\n                    while (*q == ' ' || *q == '\\t') q++;\n                    if (*q)\n                        error("extra tokens after #line directive");\n                    free(logical_file);\n                    logical_file = next_file;\n                }\n\n                line_offset = (int)requested - (line_no + 1);\n                free(expanded);\n            } else if (is_cond_active() && !strcmp(directive, "error")) {\n                error("#error %s", start);\n            }\n'''
          if old not in s:
              raise SystemExit('#error anchor not found')
          s = s.replace(old, new, 1)

          old = '''    preprocess_depth--;\n    current_pp_file = saved_file;\n    current_pp_line = saved_line;\n    return out.data;\n'''
          new = '''    preprocess_depth--;\n    current_pp_file = saved_file;\n    current_pp_line = saved_line;\n    free(logical_file);\n    return out.data;\n'''
          if old not in s:
              raise SystemExit('preprocessor cleanup anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('test/predefined_source_macros.sh')
          ts = t.read_text()
          marker = "echo 'All predefined __LINE__/__FILE__ tests passed!'\n"
          block = r'''\ncat > tmp-line-remap-header.h <<'EOF'\n#line 40 "virtual-header.h"\nint remapped_header_line(void) { return __LINE__; }\nconst char *remapped_header_file(void) { return __FILE__; }\nEOF\n\ncat > tmp-line-remap.c <<'EOF'\n#define TARGET_LINE 200\n#define TARGET_FILE "generated-input.c"\n#line TARGET_LINE TARGET_FILE\nint remapped_line = __LINE__;\nconst char *remapped_file = __FILE__;\n#include "tmp-line-remap-header.h"\nint streq2(const char *a, const char *b) {\n  while (*a && *a == *b) { a++; b++; }\n  return *a == *b;\n}\n#line 700\nint second_line = __LINE__;\n#line 900\n#if __LINE__ != 900\n#error #line must affect __LINE__ in conditionals\n#endif\nint main(void) {\n  if (remapped_line != 200) return 1;\n  if (!streq2(remapped_file, "generated-input.c")) return 2;\n  if (remapped_header_line() != 40) return 3;\n  if (!streq2(remapped_header_file(), "virtual-header.h")) return 4;\n  if (second_line != 700) return 5;\n  if (!streq2(__FILE__, "generated-input.c")) return 6;\n  return 0;\n}\nEOF\n./minicc tmp-line-remap.c > tmp-line-remap.s\ncc -o tmp-line-remap tmp-line-remap.s\n./tmp-line-remap\necho "OK(predefined source macros): #line remaps line/file and include context"\nrm -f tmp-line-remap-header.h tmp-line-remap.c tmp-line-remap.s tmp-line-remap\n\necho 'All #line directive tests passed!'\n'''
          if '#line directive tests passed' not in ts:
              if marker not in ts:
                  raise SystemExit('predefined source test marker not found')
              ts = ts.replace(marker, marker + block, 1)
              t.write_text(ts)
          PY
      - name: Run full test suite
        run: make test
      - name: Commit migration result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c test/predefined_source_macros.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Support standard #line directive'
          git push origin HEAD:fix-pp-line-directive
