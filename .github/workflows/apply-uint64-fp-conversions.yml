name: Apply uint64 floating conversion migration

on:
  push:
    branches:
      - agent/uint64-fp-conversions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uint64-fp-conversions
      - name: Apply migration
        run: python3 tools/apply_uint64_fp_conversions.py
      - name: Test compiler
        run: |
          make clean
          make test
      - name: Commit verified implementation
        run: |
          rm tools/apply_uint64_fp_conversions.py
          rm .github/workflows/apply-uint64-fp-conversions.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add codegen.c Makefile README.md test/uint64_fp_conversions.sh
          git add -u tools/apply_uint64_fp_conversions.py .github/workflows/apply-uint64-fp-conversions.yml
          git commit -m "Fix full-range uint64 floating conversions"
          git push origin HEAD:agent/uint64-fp-conversions
