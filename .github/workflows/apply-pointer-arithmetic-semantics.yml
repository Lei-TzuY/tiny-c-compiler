name: Apply pointer arithmetic semantics migration

on:
  push:
    branches:
      - agent/pointer-arithmetic-semantics

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pointer-arithmetic-semantics
      - name: Apply migration
        run: |
          python3 tools/apply_pointer_arithmetic_semantics.py
          python3 tools/patch_stdarg_pointer_arith.py
      - name: Test compiler
        run: |
          make clean
          make test
      - name: Commit verified implementation
        run: |
          rm tools/apply_pointer_arithmetic_semantics.py
          rm tools/patch_stdarg_pointer_arith.py
          rm .github/workflows/apply-pointer-arithmetic-semantics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parse.c preprocess_v2.c Makefile README.md test/pointer_arithmetic.sh tools/apply_pointer_arithmetic_semantics.py tools/patch_stdarg_pointer_arith.py .github/workflows/apply-pointer-arithmetic-semantics.yml
          git commit -m 'Enforce pointer arithmetic semantics'
          git push origin HEAD:agent/pointer-arithmetic-semantics
