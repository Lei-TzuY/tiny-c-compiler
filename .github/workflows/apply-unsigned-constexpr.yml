name: Apply unsigned constexpr migration

on:
  push:
    branches:
      - agent/unsigned-constexpr

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unsigned-constexpr
      - name: Apply migration
        run: |
          python3 tools/apply_unsigned_constexpr.py
          python3 tools/fix_unsigned_constexpr_normalization.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f tools/apply_unsigned_constexpr.py tools/fix_unsigned_constexpr_normalization.py .github/workflows/apply-unsigned-constexpr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make integer constant expressions type-aware'
          git push origin HEAD:agent/unsigned-constexpr
