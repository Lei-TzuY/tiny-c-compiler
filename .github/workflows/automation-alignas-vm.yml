name: Apply _Alignas VM fix

on:
  push:
    branches:
      - fix-alignas-variably-modified-type

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply production fix and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('parse.c')
          s = p.read_text()
          old = '''        if (!aty || aty->kind == TY_VOID || aty->kind == TY_FUNC ||\n            is_incomplete_object_type(aty))\n            error_at(kw->loc, "_Alignas type must be a complete object type");\n        align = aty->align > 0 ? aty->align : 1;\n'''
          new = '''        if (!aty || aty->kind == TY_VOID || aty->kind == TY_FUNC ||\n            is_incomplete_object_type(aty))\n            error_at(kw->loc, "_Alignas type must be a complete object type");\n        if (type_is_variably_modified(aty))\n            error_at(kw->loc, "_Alignas type must not be variably modified");\n        align = aty->align > 0 ? aty->align : 1;\n'''
          if old not in s:
              raise SystemExit('parse.c anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('test/alignas.sh')
          s = p.read_text()
          anchor = '''assert_reject '_Alignas(int(void)) char x; int main(void){return 0;}'\n'''
          added = anchor + '''assert_reject 'int main(void){int n=4; _Alignas(int[n]) char x; return 0;}'\nassert_reject 'int main(void){int n=4; _Alignas(int (*)[n]) char x; return 0;}'\n'''
          if anchor not in s:
              raise SystemExit('alignas.sh anchor not found')
          p.write_text(s.replace(anchor, added, 1))
          PY
      - name: Run focused regression
        run: |
          make minicc
          bash test/alignas.sh
      - name: Run full test suite
        run: make test
      - name: Commit verified changes and remove bootstrap workflow
        run: |
          git rm .github/workflows/automation-alignas-vm.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add parse.c test/alignas.sh
          git commit -m "Reject variably modified _Alignas type names"
          git push origin HEAD:fix-alignas-variably-modified-type
