name: Migrate pragma once support

on:
  push:
    branches:
      - feat/pragma-once

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pragma-once
          fetch-depth: 0
      - name: Apply pragma once support
        run: python3 tools/migrate_pragma_once.py
      - name: Commit migrated sources
        run: |
          if git diff --quiet -- preprocess_v2.c Makefile test/preprocessor_pragma_once.sh; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c Makefile test/preprocessor_pragma_once.sh
          git commit -m 'Support pragma once by physical header identity'
          git push origin HEAD:feat/pragma-once
