name: Migrate dependency target options

on:
  push:
    branches:
      - feat/dependency-target-options

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dependency target option support
        run: python3 tools/migrate_dependency_target_options.py
      - name: Commit migrated sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.c test/dependency_generation.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Support -MP and -MQ dependency options'
          git push
