name: Apply control condition scalars
on:
  push:
    branches:
      - agent/control-condition-scalars
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_control_condition_scalars.py
      - name: Test
        run: make clean && make test
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c Makefile README.md test/control_condition_scalars.sh
          git diff --cached --quiet && exit 0
          git commit -m "Enforce scalar control-flow conditions"
          git push
