name: Apply predefined func
on:
  push:
    branches:
      - agent/c99-predefined-func
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c99-predefined-func
      - name: Apply migration
        run: python3 tools/apply_predefined_func.py
      - name: Validate focused and full suite
        run: |
          make clean && make
          bash ./test/predefined_func.sh
          make test
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c Makefile README.md
          git diff --cached --quiet && exit 0
          git commit -m "Support C99 predefined __func__ identifier"
          git push origin HEAD:agent/c99-predefined-func
