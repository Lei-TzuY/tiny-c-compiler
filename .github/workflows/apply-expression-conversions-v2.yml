name: Apply expression conversion migration

on:
  push:
    branches:
      - agent/expression-conversions-v2
    paths:
      - migration_expression_conversions.py
      - .github/workflows/apply-expression-conversions-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expression-conversions-v2
      - name: Apply migration
        run: python3 migration_expression_conversions.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm migration_expression_conversions.py
          rm .github/workflows/apply-expression-conversions-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce expression conversion semantics'
          git push origin agent/expression-conversions-v2
