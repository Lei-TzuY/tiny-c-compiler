name: Apply VLA assignment bound fix
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch parser and tests
        shell: bash
        run: |
          set -euxo pipefail
          test "$(grep -Fc 'bound = ternary(&tok, tok);' parse.c)" -ge 1
          python3 -c 'from pathlib import Path; p=Path("parse.c"); s=p.read_text(); old="            bound = ternary(&tok, tok);"; new="            // Array size syntax is an assignment-expression (C11 6.7.6.2), so VLA\\n            // bounds may contain assignments and compound assignments.\\n            bound = assign(&tok, tok);"; assert old in s; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("test/vla.sh"); s=p.read_text(); marker="# Dynamic allocations satisfy the element alignment and preserve call ABI\\n"; add="# Array bounds use the full assignment-expression grammar. Runtime side\\n# effects occur once for a VLA/sizeof, while _Alignof still does not evaluate it.\\nassert_run 0 '\''int main(void){int n=2;int a[n+=2];return n==4&&sizeof a==16?0:1;}'\''\\nassert_run 0 '\''int main(void){int n=2;unsigned long s=sizeof(int[n=5]);return s==20&&n==5?0:1;}'\''\\nassert_run 0 '\''int main(void){int n=3;unsigned long a=_Alignof(int[n+=2]);return a==4&&n==3?0:1;}'\''\\n\\n"; assert marker in s and "int a[n+=2]" not in s; p.write_text(s.replace(marker,add+marker,1))'
      - name: Run complete test suite
        run: make test
      - name: Commit change
        shell: bash
        run: |
          set -eux
          rm .github/workflows/apply-vla-assignment-bound-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add parse.c test/vla.sh .github/workflows/apply-vla-assignment-bound-fix.yml
          git commit -m 'Support assignment expressions in VLA bounds'
          git push origin HEAD:fix-vla-assignment-expression-bound
