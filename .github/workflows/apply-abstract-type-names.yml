name: Apply abstract type-name migration

on:
  push:
    branches: [agent/abstract-type-names]
    paths:
      - 'tools/apply_abstract_type_names.py'
      - '.github/workflows/apply-abstract-type-names.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/abstract-type-names
      - name: Apply migration
        run: python3 tools/apply_abstract_type_names.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f tools/apply_abstract_type_names.py .github/workflows/apply-abstract-type-names.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support recursive abstract type names"
          git push origin HEAD:agent/abstract-type-names
