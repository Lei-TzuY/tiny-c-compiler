name: Apply datetime builtin patch

on:
  push:
    branches:
      - fix-predefined-date-time

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-predefined-date-time
      - name: Apply source and regression patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('preprocess_v2.c')
          s = p.read_text()

          def replace_once(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one match, got {s.count(old)} for:\n{old}')
              s = s.replace(old, new, 1)

          replace_once('#include <sys/stat.h>\n', '#include <sys/stat.h>\n#include <time.h>\n')
          replace_once('    BUILTIN_MACRO_LINE,\n    BUILTIN_MACRO_FILE,\n',
                       '    BUILTIN_MACRO_LINE,\n    BUILTIN_MACRO_FILE,\n    BUILTIN_MACRO_DATE,\n    BUILTIN_MACRO_TIME,\n')
          replace_once('static int current_pp_line;\n',
                       'static int current_pp_line;\nstatic char builtin_date[12];\nstatic char builtin_time[9];\n')
          replace_once('static bool stat_source(const char *source_name, struct stat *st) {\n', '''static void initialize_datetime_builtins(void) {
    time_t now = time(NULL);
    struct tm *local = localtime(&now);
    if (!local)
        error("failed to obtain local time for predefined macros");

    if (!strftime(builtin_date, sizeof(builtin_date), "%b %d %Y", local) ||
        !strftime(builtin_time, sizeof(builtin_time), "%H:%M:%S", local))
        error("failed to format predefined date/time macros");

    // C requires a space-padded one-digit day: "Mmm dd yyyy".
    if (builtin_date[4] == '0')
        builtin_date[4] = ' ';
}

static bool stat_source(const char *source_name, struct stat *st) {
''')
          replace_once('''        } else if (m && m->builtin == BUILTIN_MACRO_FILE) {
            error("__FILE__ expands to a string and is not valid in #if arithmetic");
''', '''        } else if (m && (m->builtin == BUILTIN_MACRO_FILE ||
                         m->builtin == BUILTIN_MACRO_DATE ||
                         m->builtin == BUILTIN_MACRO_TIME)) {
            error("predefined string macro is not valid in #if arithmetic");
''')
          replace_once('''        if (m->builtin == BUILTIN_MACRO_FILE) {
            char *quoted = quote_pp_string(current_pp_file ? current_pp_file : "<stdin>");
            sb_puts(&out, quoted);
            free(quoted);
            free(ident);
            continue;
        }
''', '''        if (m->builtin == BUILTIN_MACRO_FILE) {
            char *quoted = quote_pp_string(current_pp_file ? current_pp_file : "<stdin>");
            sb_puts(&out, quoted);
            free(quoted);
            free(ident);
            continue;
        }
        if (m->builtin == BUILTIN_MACRO_DATE || m->builtin == BUILTIN_MACRO_TIME) {
            const char *value = m->builtin == BUILTIN_MACRO_DATE ? builtin_date : builtin_time;
            char *quoted = quote_pp_string(value);
            sb_puts(&out, quoted);
            free(quoted);
            free(ident);
            continue;
        }
''')
          replace_once('''        add_macro(strdup("__STDC_HOSTED__"), true, false, NULL, 0, strdup("1"));
        add_builtin_macro("__LINE__", BUILTIN_MACRO_LINE);
        add_builtin_macro("__FILE__", BUILTIN_MACRO_FILE);
        apply_cli_macro_actions();
''', '''        add_macro(strdup("__STDC_HOSTED__"), true, false, NULL, 0, strdup("1"));
        initialize_datetime_builtins();
        add_builtin_macro("__LINE__", BUILTIN_MACRO_LINE);
        add_builtin_macro("__FILE__", BUILTIN_MACRO_FILE);
        add_builtin_macro("__DATE__", BUILTIN_MACRO_DATE);
        add_builtin_macro("__TIME__", BUILTIN_MACRO_TIME);
        apply_cli_macro_actions();
''')
          p.write_text(s)

          test = Path('test/predefined_datetime_macros.sh')
          test.write_text(r'''#!/bin/bash
set -eu

cat > tmp-datetime-header.h <<'EOF'
const char *header_date(void) { return __DATE__; }
const char *header_time(void) { return __TIME__; }
EOF

cat > tmp-datetime.c <<'EOF'
#if !defined(__DATE__) || !defined(__TIME__)
#error C11 predefined date/time macros must be defined
#endif
#include "tmp-datetime-header.h"
#define DATE_THROUGH_MACRO __DATE__
#define TIME_THROUGH_MACRO __TIME__
int streq(const char *a, const char *b) {
  while (*a && *a == *b) { a++; b++; }
  return *a == *b;
}
int digit(char c) { return c >= '0' && c <= '9'; }
int alpha(char c) { return (c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z'); }
int main(void) {
  const char *d = __DATE__;
  const char *t = __TIME__;
  if (sizeof(__DATE__) != 12 || sizeof(__TIME__) != 9) return 1;
  if (!alpha(d[0]) || !alpha(d[1]) || !alpha(d[2]) || d[3] != ' ') return 2;
  if (!((d[4] == ' ') || digit(d[4])) || !digit(d[5]) || d[6] != ' ') return 3;
  if (!digit(d[7]) || !digit(d[8]) || !digit(d[9]) || !digit(d[10]) || d[11]) return 4;
  if (!digit(t[0]) || !digit(t[1]) || t[2] != ':' || !digit(t[3]) ||
      !digit(t[4]) || t[5] != ':' || !digit(t[6]) || !digit(t[7]) || t[8]) return 5;
  if (!streq(d, header_date()) || !streq(t, header_time())) return 6;
  if (!streq(d, DATE_THROUGH_MACRO) || !streq(t, TIME_THROUGH_MACRO)) return 7;
  return 0;
}
EOF

./minicc tmp-datetime.c > tmp-datetime.s
cc -o tmp-datetime tmp-datetime.s
./tmp-datetime

echo 'OK(predefined date/time macros): format, definition, macro rescan and translation consistency'
rm -f tmp-datetime-header.h tmp-datetime.c tmp-datetime.s tmp-datetime
''')

          m = Path('Makefile')
          ms = m.read_text()
          needle = '\tbash ./test/predefined_source_macros.sh\n'
          if ms.count(needle) != 1:
              raise SystemExit('Makefile insertion point changed')
          ms = ms.replace(needle, needle + '\tbash ./test/predefined_datetime_macros.sh\n', 1)
          m.write_text(ms)
          PY
          make test
      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c Makefile test/predefined_datetime_macros.sh
          git commit -m 'Implement __DATE__ and __TIME__ predefined macros'
          git push origin HEAD:fix-predefined-date-time
