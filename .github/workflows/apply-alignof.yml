name: Apply _Alignof migration
on:
  push:
    branches:
      - agent/c11-alignof
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c11-alignof
      - name: Apply parser migration
        run: python3 tools/apply_alignof.py
      - name: Build compiler
        run: make clean && make
      - name: Commit parser change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parse.c
          git diff --cached --quiet && exit 0
          git commit -m "Support C11 _Alignof type queries"
          git push origin HEAD:agent/c11-alignof
