name: Apply unnamed prototype parameter migration

on:
  push:
    branches:
      - agent/unnamed-prototype-params

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unnamed-prototype-params
      - name: Apply migration
        run: python3 tools/apply_unnamed_prototype_params.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f tools/apply_unnamed_prototype_params.py .github/workflows/apply-unnamed-prototype-params.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support unnamed prototype parameters"
          git push origin HEAD:agent/unnamed-prototype-params
