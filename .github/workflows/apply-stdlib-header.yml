name: Apply expanded stdlib header

on:
  push:
    branches:
      - agent/stdlib-header
    paths:
      - tools/apply_stdlib_header.py
      - test/stdlib_header.sh
      - .github/workflows/apply-stdlib-header.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stdlib-header
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/apply_stdlib_header.py
      - name: Audit stdlib expansion
        run: |
          grep -q '#define RAND_MAX 2147483647' preprocess_v2.c
          grep -q 'typedef struct { int quot; int rem; } div_t' preprocess_v2.c
          grep -q 'void qsort' preprocess_v2.c
          grep -q 'void \*bsearch' preprocess_v2.c
          grep -q 'unsigned long long strtoull' preprocess_v2.c
          grep -q 'test/stdlib_header.sh' Makefile
      - name: Validate full suite
        run: make clean && make test
      - name: Commit generated changes
        run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add preprocess_v2.c Makefile test/stdlib_header.sh
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Expand supported stdlib.h declarations'
          git push origin HEAD:agent/stdlib-header
