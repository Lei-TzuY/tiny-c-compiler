name: Apply semantic assignment migration

on:
  push:
    branches:
      - agent/semantic-assignments

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-assignments
      - name: Apply migration
        run: python3 migration_semantic_assignments.py
      - name: Test compiler
        run: make clean && make test
      - name: Commit verified implementation
        run: |
          rm -f migration_semantic_assignments.py tools/apply-semantic-assignments.py
          rm -f .github/workflows/apply-semantic-assignments.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce expression assignment compatibility"
          git push origin HEAD:agent/semantic-assignments
