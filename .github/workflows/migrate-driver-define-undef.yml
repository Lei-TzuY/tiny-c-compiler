name: Migrate driver define/undef options

on:
  push:
    branches:
      - feat/driver-define-undef

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/driver-define-undef
          fetch-depth: 0
      - name: Apply driver macro option support
        run: python3 tools/migrate_driver_define_undef.py
      - name: Commit migrated sources
        run: |
          if git diff --quiet -- main.c preprocess_v2.c preprocess_v2.h test/driver_cli.sh; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.c preprocess_v2.c preprocess_v2.h test/driver_cli.sh
          git commit -m 'Support ordered -D and -U driver options'
          git push origin HEAD:feat/driver-define-undef
