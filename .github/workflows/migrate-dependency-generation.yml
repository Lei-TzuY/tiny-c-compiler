name: Migrate dependency generation

on:
  push:
    branches:
      - feat/dependency-generation

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix dependency sidecar path handling
        run: python3 tools/fix_dependency_output_path.py
      - name: Commit path fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.c test/dependency_generation.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Fix dependency sidecar path derivation'
          git push
