name: Migrate dependency generation

on:
  push:
    branches:
      - feat/dependency-generation

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dependency generation support
        run: python3 tools/migrate_dependency_generation.py
      - name: Commit migrated sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.c preprocess_v2.c preprocess_v2.h Makefile test/dependency_generation.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Support Make dependency generation'
          git push
