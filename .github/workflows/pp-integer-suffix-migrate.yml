name: Apply preprocessor integer suffix fix

on:
  push:
    branches: [fix/pp-integer-suffix-validation]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('preprocess_v2.c')
          text = src.read_text()
          old = '''    if (isdigit((unsigned char)*e->p)) {
        char *end;
        unsigned long long val = strtoull(e->p, &end, 0);
        if (end == e->p)
            error("invalid number in #if expression");
        e->p = end;
        while (*e->p == 'u' || *e->p == 'U' || *e->p == 'l' || *e->p == 'L')
            e->p++;
        return (int64_t)val;
    }
'''
          new = '''    if (isdigit((unsigned char)*e->p)) {
        char *end;
        unsigned long long val = strtoull(e->p, &end, 0);
        if (end == e->p)
            error("invalid number in #if expression");

        const char *suffix = end;
        bool seen_u = false;
        int l_count = 0;
        if (*suffix == 'u' || *suffix == 'U') {
            seen_u = true;
            suffix++;
        }
        if (*suffix == 'l' || *suffix == 'L') {
            char first = *suffix++;
            l_count = 1;
            if (*suffix == first) {
                suffix++;
                l_count = 2;
            }
        }
        if (!seen_u && (*suffix == 'u' || *suffix == 'U')) {
            seen_u = true;
            suffix++;
        }
        if (*suffix == 'u' || *suffix == 'U' || *suffix == 'l' || *suffix == 'L')
            error("invalid integer suffix in #if expression");
        (void)seen_u;
        (void)l_count;
        e->p = suffix;
        return (int64_t)val;
    }
'''
          if old in text:
              src.write_text(text.replace(old, new, 1))
          elif 'invalid integer suffix in #if expression' not in text:
              raise SystemExit('numeric parser pattern not found')

          test = Path('test/preprocessor_advanced.sh')
          t = test.read_text()
          marker = '''# Integer constant suffixes in #if expressions follow C grammar.\n'''
          if marker not in t:
              insert = '''\n# Integer constant suffixes in #if expressions follow C grammar.\nassert_pp_adv 33 '#if 1U == 1 && 1UL == 1 && 1LU == 1 && 1ULL == 1 && 1LLU == 1\nint main() { return 33; }\n#else\nint main() { return 0; }\n#endif'\n\nassert_pp_fail '#if 1UU\nint main() { return 0; }\n#endif'\n\nassert_pp_fail '#if 1ULU\nint main() { return 0; }\n#endif'\n\nassert_pp_fail '#if 1LLL\nint main() { return 0; }\n#endif'\n\n'''
              t = t.replace('echo "All advanced preprocessor tests passed!"\n', insert + 'echo "All advanced preprocessor tests passed!"\n')
              test.write_text(t)
          PY
      - name: Commit migration result
        run: |
          if git diff --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c test/preprocessor_advanced.sh
          git commit -m "Validate preprocessor integer constant suffixes"
          git push origin HEAD:fix/pp-integer-suffix-validation
