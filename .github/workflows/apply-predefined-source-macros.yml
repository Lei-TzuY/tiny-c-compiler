name: Apply predefined source macros
on:
  push:
    branches:
      - agent/predefined-line-file
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/predefined-line-file
      - name: Apply migration
        run: python3 tools/apply_predefined_source_macros.py
      - name: Build compiler
        run: make clean && make
      - name: Commit core changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preprocess_v2.c preprocess_v2.h main.c
          git diff --cached --quiet && exit 0
          git commit -m "Support dynamic __LINE__ and __FILE__ macros"
          git push origin HEAD:agent/predefined-line-file
