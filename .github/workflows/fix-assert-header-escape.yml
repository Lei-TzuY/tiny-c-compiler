name: Fix assert header escape

on:
  push:
    branches:
      - feat/assert-header-c11

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assert-header-c11
          fetch-depth: 0
      - name: Fix assert header escaping
        run: python3 tools/fix_assert_header_escape.py
      - name: Commit fix
        run: |
          if git diff --quiet -- preprocess_v2.c; then
            echo 'No escape fix required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preprocess_v2.c
          git commit -m 'Fix assert header string escaping'
          git push origin HEAD:feat/assert-header-c11
